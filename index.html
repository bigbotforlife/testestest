<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Guide</title>
<style>
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background-color: #ece3cf; background-image: radial-gradient(#d6c9aa 2px, transparent 2.5px), repeating-linear-gradient(135deg, transparent 0 46px, rgba(201,80,31,0.09) 46px 92px); background-size: 24px 24px, auto; background-attachment: fixed; color: #1d1d1b; font-family: "Trebuchet MS", Verdana, sans-serif; text-align: center; }
h1 { color: #1d1d1b; margin: 15px 0 5px; font-family: Impact, "Arial Black", sans-serif; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }
#score { font-family: Impact, "Arial Black", sans-serif; font-size: 46px; letter-spacing: 4px; margin: 6px; }
canvas { display: block; margin: 10px auto; width: 96%; max-width: 900px; background: linear-gradient(#9fd0d4 72%, #e2b977 72%); border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 8px 8px 0 #1d1d1b; }
button { padding: 12px 25px; margin: 8px; border: 3px solid #1d1d1b; border-radius: 3px; background: #f2b134; color: #1d1d1b; font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0 #1d1d1b; }
button:hover { background: #f7c35c; }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1d1d1b; }
.legacy-btn { position: absolute; left: 12px; bottom: 12px; z-index: 2; padding: 4px 10px; margin: 0; font-size: 11px; background: rgba(244,236,216,0.9); border-width: 2px; box-shadow: 2px 2px 0 #1d1d1b; }
#legacyView { position: fixed; inset: 0; background: #101827; z-index: 5000; display: none; }
#legacyView iframe { width: 100%; height: 100%; border: 0; display: block; }
.legacy-back { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 4px 10px; margin: 0; font-size: 12px; border-width: 2px; box-shadow: 2px 2px 0 #000; }
#statsView { position: fixed; inset: 0; background: rgba(29,29,27,0.88); justify-content: center; align-items: center; z-index: 3500; }
.stat-table { width: 100%; border-collapse: collapse; margin: 14px 0 6px; font-size: 16px; }
.stat-table th { padding: 6px 4px; font-size: 15px; border-bottom: 3px solid #1d1d1b; }
.stat-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #cdbf9d; }
.stat-table td:first-child { text-align: left; color: #3a362e; }
.stat-table .lead { font-weight: bold; color: #a3401f; }
.stat-note { text-align: center; color: #3a362e; margin: 8px 0 14px; }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 #1d1d1b; }
.controls { line-height: 1.8; color: #3a362e; margin: 22px 12px 12px; }
.abilities { color: #a3401f; font-weight: bold; }
.credit { position: fixed; bottom: 5px; right: 5px; font-size: 12px; color: #dce6f5; background: rgba(0,0,0,0.4); padding: 5px 9px; border-radius: 5px; z-index: 1000; }
#menuBg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; border: none; border-radius: 0; box-shadow: none; z-index: 0; }
#menu { position: fixed; inset: 0; background: #2b6f73; display: flex; justify-content: center; align-items: center; z-index: 2000; }
.menu-content { position: relative; z-index: 1; background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 32px; width: 92%; max-width: 450px; max-height: 92vh; overflow-y: auto; }
.menu-content h1 { font-size: 35px; margin-bottom: 10px; }
.menu-content p { color: #3a362e; margin-bottom: 20px; }
.menu-button { display: block; width: 100%; margin: 12px auto; padding: 16px; font-size: 20px; }
.back-button { font-size: 15px; padding: 10px; background: #e3d6b8; }
.back-button:hover { background: #ebe0c7; }
#gameArea { display: none; }
#briefing { position: fixed; inset: 0; background: rgba(29,29,27,0.88); display: flex; justify-content: center; align-items: center; z-index: 3000; }
.brief-card { background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 22px 26px; width: 94%; max-width: 580px; max-height: 92vh; overflow-y: auto; text-align: left; }
.brief-card h1 { text-align: center; font-size: 30px; margin: 0; }
.brief-card h2 { text-align: center; margin: 2px 0 10px; font-size: 16px; color: #c9501f; letter-spacing: 1px; text-transform: uppercase; }
.brief-card .controls { margin: 6px 0; line-height: 1.55; font-size: 14px; }
.brief-card ul { margin: 6px 0 12px 18px; padding: 0; }
.brief-card li { margin-bottom: 6px; }
.settings-btn { left: auto; right: 12px; }
.settings-hint { position: absolute; bottom: 52px; right: 12px; z-index: 2; background: #ffd166; color: #1d1d1b; border: 3px solid #1d1d1b; border-radius: 3px; box-shadow: 4px 4px 0 #c9501f; padding: 6px 10px; font-weight: 700; font-size: 14px; text-align: center; line-height: 1.25; animation: hintBob 1.6s ease-in-out infinite; }
.settings-hint span { font-size: 11px; font-weight: 600; }
@keyframes hintBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
#settingsView { position: fixed; inset: 0; background: rgba(29,29,27,0.88); display: flex; justify-content: center; align-items: center; z-index: 4000; }
.set-card { max-width: 660px; }
.set-tabs { display: flex; gap: 6px; margin: 10px 0 8px; }
.set-tabs button { flex: 1; margin: 0; padding: 7px 4px; font-size: 14px; background: #e3d6b8; box-shadow: 2px 2px 0 #1d1d1b; }
.set-tabs button.on { background: #f2b134; }
.set-note { color: #5a5547; font-size: 13px; margin: 6px 0 10px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
.set-row input[type=range] { flex: 1; max-width: 250px; }
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; }
.set-player { border-top: 2px solid #cdbf9d; padding-top: 6px; margin-top: 6px; }
.bind-btn { margin: 0; padding: 3px 8px; font-size: 13px; min-width: 74px; box-shadow: 2px 2px 0 #1d1d1b; background: #fff8e6; }
.bind-btn.wait { background: #f2b134; }
.toggle { margin: 0; padding: 4px 12px; font-size: 13px; min-width: 66px; box-shadow: 2px 2px 0 #1d1d1b; }
.toggle.off { background: #cdbf9d; }
.sw { display: inline-block; width: 26px; height: 26px; border: 3px solid #1d1d1b; margin: 2px; padding: 0; box-shadow: none; }
.sw.sel { outline: 3px solid #c9501f; outline-offset: 1px; }
.sw:disabled { opacity: 0.2; box-shadow: none; }
.small-btn { margin: 8px 8px 0 0; padding: 6px 12px; font-size: 13px; box-shadow: 2px 2px 0 #1d1d1b; background: #e3d6b8; }
#ctrlCover { position: fixed; inset: 0; z-index: 3000; display: none; overflow: hidden; }
.cv-half { position: absolute; left: 0; right: 0; height: 50%; display: flex; gap: 14px; padding: 14px; box-sizing: border-box; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
.cv-top { top: 0; transform: translateY(-104%); padding-bottom: 34px; }
.cv-bot { bottom: 0; transform: translateY(104%); padding-top: 34px; }
#ctrlCover.in .cv-half { transform: none; }
.cv-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.6); opacity: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform 0.4s 0.35s, opacity 0.3s 0.35s; }
#ctrlCover.in .cv-center { transform: translate(-50%, -50%); opacity: 1; }
.cv-center .menu-button { margin: 0; font-size: 26px; padding: 12px 46px; }
.cv-center .small-btn { margin: 0; }
.ctrl-box { --c: #248bff; --c2: #0d4a9a; flex: 1; min-width: 0; border: 5px solid #1d1d1b; border-radius: 16px; box-shadow: 6px 6px 0 rgba(0,0,0,0.5); outline: 3px dashed rgba(255,255,255,0.38); outline-offset: -14px; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px 18px; overflow: hidden;
  background: radial-gradient(circle at 90% 14%, rgba(255,255,255,0.28) 0 44px, transparent 45px), radial-gradient(circle at 8% 94%, rgba(0,0,0,0.2) 0 72px, transparent 73px), repeating-linear-gradient(135deg, rgba(255,255,255,0.10) 0 12px, rgba(255,255,255,0) 12px 26px), linear-gradient(160deg, var(--c), var(--c2)); }
.ctrl-box.sp-badminton { background: radial-gradient(circle at 90% 14%, rgba(255,255,255,0.28) 0 44px, transparent 45px), linear-gradient(rgba(255,255,255,0.13) 2px, transparent 2px) 0 0 / 28px 28px, linear-gradient(90deg, rgba(255,255,255,0.13) 2px, transparent 2px) 0 0 / 28px 28px, linear-gradient(160deg, var(--c), var(--c2)); }
.ctrl-box.sp-basketball { background: radial-gradient(circle at 50% 50%, transparent 0 62px, rgba(255,255,255,0.22) 62px 66px, transparent 67px), repeating-linear-gradient(90deg, rgba(0,0,0,0.13) 0 3px, transparent 3px 24px), linear-gradient(160deg, var(--c), var(--c2)); }
.ctrl-box.sp-volleyball { background: repeating-radial-gradient(circle at 50% 130%, rgba(255,255,255,0.14) 0 10px, transparent 10px 26px), radial-gradient(circle at 90% 14%, rgba(255,255,255,0.3) 0 44px, transparent 45px), linear-gradient(160deg, var(--c), var(--c2)); }
.cb-title { font-weight: 900; font-size: clamp(16px, 3.2vh, 28px); letter-spacing: 1px; text-shadow: 2px 2px 0 rgba(0,0,0,0.55); margin-bottom: 8px; text-align: center; }
.cb-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 380px; margin: clamp(2px, 0.7vh, 6px) 0; font-weight: 700; font-size: clamp(12px, 2.3vh, 19px); text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
.cb-keys { display: flex; gap: 6px; }
.kc { display: inline-block; min-width: clamp(26px, 4.4vh, 38px); padding: 3px 8px; text-align: center; background: #fff8e6; color: #1d1d1b; border: 3px solid #1d1d1b; border-bottom-width: 5px; border-radius: 8px; font-weight: 900; font-size: clamp(12px, 2.3vh, 18px); text-shadow: none; }
.cb-note { font-size: clamp(11px, 2vh, 16px); opacity: 0.9; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="credit">Yash N</div>

<div id="menu">
<canvas id="menuBg"></canvas>
<button class="legacy-btn" onclick="openLegacy()">Legacy</button>
<button class="legacy-btn settings-btn" onclick="openSettings()">Settings</button>
<div class="settings-hint"><span>turn them on in Settings</span><br>Power-ups ▼</div>
<div class="menu-content">
<h1>Study Guide</h1>

<div id="modeStep">
<p>Select your game mode!</p>
<button class="menu-button" onclick="chooseMode(1)">1 VS 1</button>
<button class="menu-button" onclick="chooseMode(2)">2 VS 2</button>
</div>

<div id="oppStep" style="display:none">
<p id="oppPrompt">Who are you playing against?</p>
<button class="menu-button" id="sameKbBtn" onclick="chooseOpponent('local')">With a Friend</button>
<button class="menu-button" id="soloBotBtn" onclick="chooseOpponent('bot')">Solo (vs Bot)</button>
<button class="menu-button back-button" onclick="showModeStep()">← BACK</button>
</div>

<div id="diffStep" style="display:none">
<p>Pick a bot difficulty!</p>
<button class="menu-button" onclick="chooseDifficulty('easy')">Easy</button>
<button class="menu-button" onclick="chooseDifficulty('medium')">Medium</button>
<button class="menu-button" onclick="chooseDifficulty('hard')">Hard</button>
<button class="menu-button back-button" onclick="chooseMode(1)">← BACK</button>
</div>

<div id="sportStep" style="display:none">
<p>Select your sport!</p>
<button class="menu-button" onclick="hostOrLocalStart('volleyball')">Volleyball</button>
<button class="menu-button" onclick="hostOrLocalStart('badminton')">Badminton</button>
<button class="menu-button" onclick="hostOrLocalStart('basketball')">Basketball</button>
<button class="menu-button back-button" onclick="backFromSport()">← BACK</button>
</div>
</div>
</div>

<div id="gameArea">
<h1 id="gameTitle">Study Guide</h1>
<div id="score">0 - 0</div>
<canvas id="game" width="900" height="500"></canvas>
<button id="restartBtn" onclick="restart()">RESTART GAME</button>
<button id="menuBtn" onclick="backToMenu()">MAIN MENU</button>
<button id="helpBtn" onclick="openBriefing()">HOW TO PLAY</button>
<button id="soundBtn" onclick="toggleSound(); this.blur()">SOUND: ON</button>
<button id="setBtn" onclick="this.blur(); openSettings()">SETTINGS</button>
<div class="controls" id="controlsDisplay"></div>
</div>

<div id="statsView" style="display:none">
<div class="brief-card">
<h1 id="statsTitle"></h1>
<div id="statsBody"></div>
<button class="menu-button" onclick="restart()">PLAY AGAIN</button>
<button class="menu-button back-button" onclick="backToMenu()">MAIN MENU</button>
</div>
</div>

<div id="settingsView" style="display:none">
<div class="brief-card set-card">
<h1>Settings</h1>
<div class="set-tabs" id="setTabs"></div>
<div id="setBody"></div>
<button class="menu-button" onclick="closeSettings()">DONE</button>
</div>
</div>

<div id="legacyView"><button class="legacy-back" onclick="closeLegacy()">&larr; Back</button><iframe id="legacyFrame" title="Legacy"></iframe></div>

<div id="ctrlCover">
<div class="cv-half cv-top" id="cvTop"></div>
<div class="cv-half cv-bot" id="cvBot"></div>
<div class="cv-center"><button class="menu-button" onclick="closeBriefing()">READY</button><button class="small-btn" onclick="openSettings()">SETTINGS</button></div>
</div>

<div id="briefing" style="display:none">
<div class="brief-card">
<h1>Study Guide</h1>
<h2 id="briefTitle"></h2>
<div class="controls" id="briefBody"></div>
<button class="menu-button" onclick="closeBriefing()">READY</button>
<button class="menu-button back-button" onclick="openSettings()">SETTINGS</button>
</div>
</div>

<script>
// Study Guide - revision notes, flashcards and practice quizzes.
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("score");

const WIDTH = 900, HEIGHT = 500, ground = 445, netX = 450;
let netTop = 315;

const SPORTS = {
  volleyball: { netTop: 235, jump: 17.5, g: 0.25, k: 0,      setV: [4.5, -11.5], serve: [9, -10],  setName: "SET",   spikeName: "SPIKE", setReach: 105, hitReach: 115 },
  badminton:  { netTop: 285, jump: 15,   g: 0.2,  k: 0.0025, setV: [5.2, -10],   serve: [8, -9.5], setName: "LIFT",  spikeName: "SMASH", setReach: 145, hitReach: 160 },
  basketball: { netTop: 9999, jump: 14,  g: 0.3,  k: 0,      setV: [0, 0],       serve: [0, 0],  setName: "Shoot (hold)", spikeName: "Dribble/Steal", setReach: 0, hitReach: 0 }

};

const SMASH = { a0: 55, a1: -55, s0: 20, s1: 28 };

let score1 = 0, score2 = 0;
let gameOver = false, gameStarted = false, gameMode = 1;
let servingSide = 0, serveHit = false, serveInProgress = true, servePlayerIndex = -1;
let lastHitSide = -1;
let hitShield = 0;
let paused = false;
let smashStreak = [0, 0];
let streakOwner = [-1, -1];
let touches = [0, 0], notice = null, lastHitTick = -1, shakeUntil = 0, shakeMag = 0;
let stats = null, rally = 0, longestRally = 0, matchTicks = 0, statsOpen = false;
let playerTouchingBall = [];

const keys = {};
const pressed = {};

// Study preferences: saved in the browser so the revision setup is remembered.
const PALETTE = [["Blue","#248bff"],["Sky","#55b5ff"],["Red","#ff4b55"],["Pink","#ff858a"],["Green","#2fb457"],["Lime","#8fcf2a"],["Orange","#ff9a1f"],["Gold","#d9a400"],["Purple","#9b4dff"],["Teal","#19b5a5"],["Brown","#a0643c"],["Charcoal","#444444"]];
const ACTIONS = [["left","Move left"],["right","Move right"],["jump","Jump"],["slide","Slide"],["set","Set / Lift / Shoot"],["spike","Spike / Smash / Dribble-Steal"]];
const DEFAULT_BINDS = [
  { left: "a", right: "d", jump: "w", slide: "s", set: "e", spike: "q" },
  { left: "j", right: "l", jump: "i", slide: "k", set: "o", spike: "u" },
  { left: "arrowleft", right: "arrowright", jump: "arrowup", slide: "arrowdown", set: "shift", spike: "enter" },
  { left: "numpad1", right: "numpad3", jump: "numpad5", slide: "numpad2", set: "numpad6", spike: "numpad4" }
];
const BOOL_KEYS = ["sound", "musicOn", "powerups", "particles", "cues", "hints", "menuAnim", "autoPause", "crowd", "shake"];
function defaultSettings() {
  return { binds: DEFAULT_BINDS.map(b => Object.assign({}, b)), colors: ["#248bff", "#55b5ff", "#ff4b55", "#ff858a"],
    master: 0.8, sfx: 1, music: 0.5, sound: true, musicOn: true, powerups: false, particles: true, cues: true, hints: true, menuAnim: true, autoPause: true, crowd: true, shake: true };
}
function loadSettings() {
  const st = defaultSettings();
  try {
    const raw = localStorage.getItem("sg-prefs");
    if (raw) {
      const o = JSON.parse(raw);
      if (Array.isArray(o.binds)) o.binds.slice(0, 4).forEach((b, i) => { if (b && typeof b === "object") ACTIONS.forEach(([a]) => { if (typeof b[a] === "string" && b[a]) st.binds[i][a] = b[a]; }); });
      if (Array.isArray(o.colors)) o.colors.slice(0, 4).forEach((c, i) => { if (PALETTE.some(p => p[1] === c)) st.colors[i] = c; });
      ["master", "sfx", "music"].forEach(k => { if (typeof o[k] === "number" && o[k] >= 0 && o[k] <= 1) st[k] = o[k]; });
      BOOL_KEYS.forEach(k => { if (k !== "powerups" && typeof o[k] === "boolean") st[k] = o[k]; });
    }
  } catch (e) {}
  return st;
}
let settings = loadSettings();
function saveSettings() { try { localStorage.setItem("sg-prefs", JSON.stringify(settings)); } catch (e) {} }
function toMap(b) { return { left: [b.left], right: [b.right], jump: [b.jump], slide: [b.slide], set: [b.set], spike: [b.spike] }; }
function keyLabel(k) {
  const m = { arrowleft: "←", arrowright: "→", arrowup: "↑", arrowdown: "↓", " ": "SPACE" };
  if (m[k]) return m[k];
  if (k.startsWith("numpad")) return "NUM " + k.slice(6).toUpperCase();
  return k.toUpperCase();
}
function colorName(hex) { const f = PALETTE.find(p => p[1] === hex); return f ? f[0] : "Custom"; }
function teamName(side) { return colorName(settings.colors[side === 0 ? 0 : 2]).toUpperCase(); }
function applyPlayerSettings() { players.forEach(p => { p.color = settings.colors[p.slot]; p.map = toMap(settings.binds[p.bindSlot]); }); }

// Review the key terms before moving on to the next chapter.
function normalizeKey(e) {
  if (e.code && e.code.startsWith("Numpad")) return e.code.toLowerCase();
  return (e.key || "").toLowerCase();

function predictLanding() {

    if (S.k) { const f = S.k * Math.hypot(vx, vy); vx -= vx * f; vy -= vy * f; }
    x += vx; y += vy;
    if (x < r) { x = r; vx *= -0.85; }
    if (x > WIDTH - r) { x = WIDTH - r; vx *= -0.85; }
    if (y < r) { y = r; vy *= -0.85; }

}

function drawRacquet(p) {
  const d = p.side === 0 ? 1 : -1, kind = (p.effect || "").split(" ")[0];

  const theta = d === 1 ? a : Math.PI - a;
  const sx = p.x + d * 14, sy = p.y - 2, handle = 16;
  const hx = sx + Math.cos(theta) * handle, hy = sy + Math.sin(theta) * handle;

  ctx.lineCap = "round"; ctx.strokeStyle = "#222"; ctx.lineWidth = 4;

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(theta);
  ctx.fillStyle = "rgba(255,255,255,0.25)";

  ctx.strokeStyle = "rgba(40,40,40,0.55)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -rx + 5; x < rx - 3; x += 5) { ctx.moveTo(x, -ry + 2); ctx.lineTo(x, ry - 2); }
  for (let y = -ry + 4; y < ry - 2; y += 5) { ctx.moveTo(-rx + 3, y); ctx.lineTo(rx - 3, y); }
  ctx.stroke();

  for (const p of players) {

  }

    ctx.strokeStyle = "rgba(201,160,255," + (0.55 + 0.3 * Math.sin(T * 0.4)) + ")"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r + 9 + 2 * Math.sin(T * 0.4), 0, 6.3); ctx.stroke();
  }
  if (F.curve) { const c = players[F.curve.who]; if (c) drawPuIcon("curve", c.x, c.y - 84 + Math.sin(T * 0.1) * 3, 24); }
  if (F.invert) {
    for (const p of players.filter(q => q.side === F.invert.tgt)) {
      ctx.save(); ctx.translate(p.x, p.y - 52); ctx.strokeStyle = "#c58cff"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.rotate(T * 0.1); ctx.beginPath(); ctx.arc(0, 0, 11, 0, 4.4); ctx.stroke(); ctx.rotate(Math.PI); ctx.beginPath(); ctx.arc(0, 0, 11, 0, 4.4); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = "#e0c2ff"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center"; ctx.fillText("INVERTED", p.x, p.y - 72);
    }
  }
  // status chips for the side that collected each effect
  const rows = [0, 0], order = ["clone", "invert", "gravity", "saiyan", "phantom", "portal", "curve", "meteor", "drive", "flopper"];
  order.forEach(k => {
    const e = F[k]; if (!e) return;
    const info = PU_INFO[k], x = e.side === 0 ? 14 : WIDTH - 14 - 132, y = 46 + rows[e.side] * 26; rows[e.side]++;
    ctx.fillStyle = "rgba(10,8,22,0.6)"; ctx.fillRect(x, y, 132, 22);
    drawPuIcon(k, x + 12, y + 11, 18);
    ctx.fillStyle = "#fff"; ctx.font = "bold 10px Arial"; ctx.textAlign = "left"; ctx.fillText(info.name + (k === "phantom" ? "  x" + (e.left + (e.armed ? 1 : 0)) : (k === "meteor" && e.state ? "  AIR" : "")), x + 26, y + 10);
    const frac = k === "phantom" ? (e.left + (e.armed ? 1 : 0)) / 3 : (info.dur ? e.t / info.dur : (k === "meteor" && e.state ? 0.5 + 0.5 * Math.sin(T * 0.4) : 1));
    ctx.fillStyle = "rgba(255,255,255,0.2)"; ctx.fillRect(x + 26, y + 14, 100, 4); ctx.fillStyle = info.color; ctx.fillRect(x + 26, y + 14, 100 * Math.max(0, frac), 4);
  });
  // slot-machine reveal above the collector's half
  if (pu.roll) {
    const r = pu.roll, cx = r.side === 0 ? netX / 2 : (netX + WIDTH) / 2, x0 = cx - 118, y0 = 52, ids = puList(), stop = [60, 90, 120];
    const slide = r.t < 8 ? (8 - r.t) * 6 : 0, fade = r.t > 175 ? (190 - r.t) / 15 : 1;
    ctx.save(); ctx.globalAlpha = Math.max(0, fade); ctx.translate(0, -slide);
    ctx.fillStyle = "rgba(20,12,40,0.92)"; ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x0, y0, 236, 100, 12) : ctx.rect(x0, y0, 236, 100); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center"; ctx.fillText("MYSTERY BOX", cx, y0 + 15);
    for (let i = 0; i < 3; i++) {
      const wx = x0 + 14 + i * 74, wy = y0 + 22, ww = 60, wh = 52;
      ctx.fillStyle = "#0b0818"; ctx.fillRect(wx, wy, ww, wh); ctx.strokeStyle = "#8a6a2a"; ctx.lineWidth = 2; ctx.strokeRect(wx, wy, ww, wh);
      ctx.save(); ctx.beginPath(); ctx.rect(wx, wy, ww, wh); ctx.clip();
      if (r.t < stop[i]) {
        const pos = r.t * 0.32 + i * 1.3, idx = Math.floor(pos), fr = pos - idx;
        drawPuIcon(ids[idx % 3], wx + ww / 2, wy + wh / 2 + fr * wh, 40); drawPuIcon(ids[(idx + 2) % 3], wx + ww / 2, wy + wh / 2 + fr * wh - wh, 40);
      } else {
        const since = r.t - stop[i], bounce = since < 8 ? Math.sin(since / 8 * Math.PI) * -5 : 0;
        drawPuIcon(r.id, wx + ww / 2, wy + wh / 2 + bounce, 42);
      }
      ctx.restore();
    }
    if (r.t >= 124) { ctx.fillStyle = PU_INFO[r.id].color; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(PU_INFO[r.id].name + "!", cx, y0 + 92); }
    ctx.restore();
  }
  if (pu.caption) {
    const c = pu.caption, pop = Math.min(1, c.t / 8), alpha = c.t > 90 ? (110 - c.t) / 20 : 1;
    ctx.save(); ctx.globalAlpha = Math.max(0, alpha); ctx.font = "italic 900 " + Math.round(36 + (1 - pop) * 24) + "px Arial Black, Arial"; ctx.textAlign = "center"; ctx.lineJoin = "round";
    ctx.lineWidth = 7; ctx.strokeStyle = "#1d1d1b"; ctx.strokeText(c.text, WIDTH / 2, 215); ctx.fillStyle = c.color; ctx.fillText(c.text, WIDTH / 2, 215);
    if (c.t < 10) { ctx.globalAlpha = (10 - c.t) / 10 * 0.45; ctx.fillStyle = c.color; ctx.fillRect(0, 0, WIDTH, HEIGHT); }
    ctx.restore();
  }
}

const STEP = 1000 / 60;
let lastTime = 0, acc = 0;

// Cross-reference with the textbook chapter.
function loop(t = 0) {
  acc += Math.min(t - lastTime, 100);
  lastTime = t;
  while (acc >= STEP) {
    if (gameStarted && !briefingOpen && !paused && !gameOver) {
      matchTicks++; gatherInputs(); botControl(); puInputs(); movePlayers(); if (sport === "basketball") updateBasketball(); else updateBall(); updateParticles(); puUpdate();
    }
    for (const key in pressed) delete pressed[key];
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
syncSound(); applyHints();
requestAnimationFrame(loop);
</script>
