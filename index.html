<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Guide</title>
<style>
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background-color: #ece3cf; background-image: radial-gradient(#d6c9aa 2px, transparent 2.5px), repeating-linear-gradient(135deg, transparent 0 46px, rgba(201,80,31,0.09) 46px 92px); background-size: 24px 24px, auto; background-attachment: fixed; color: #1d1d1b; font-family: "Trebuchet MS", Verdana, sans-serif; text-align: center; }
h1 { color: #1d1d1b; margin: 15px 0 5px; font-family: Impact, "Arial Black", sans-serif; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }
#score { font-family: Impact, "Arial Black", sans-serif; font-size: 46px; letter-spacing: 4px; margin: 6px; }
canvas { display: block; margin: 10px auto; width: 96%; max-width: 900px; background: linear-gradient(#9fd0d4 72%, #e2b977 72%); border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 8px 8px 0 #1d1d1b; }
button { padding: 12px 25px; margin: 8px; border: 3px solid #1d1d1b; border-radius: 3px; background: #f2b134; color: #1d1d1b; font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0 #1d1d1b; }
button:hover { background: #f7c35c; }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1d1d1b; }
.legacy-btn { position: absolute; left: 12px; bottom: 12px; z-index: 2; padding: 4px 10px; margin: 0; font-size: 11px; background: rgba(244,236,216,0.9); border-width: 2px; box-shadow: 2px 2px 0 #1d1d1b; }
#legacyView { position: fixed; inset: 0; background: #101827; z-index: 5000; display: none; }
#legacyView iframe { width: 100%; height: 100%; border: 0; display: block; }
.legacy-back { position: absolute; top: 8px; left: 8px; z-index: 2; padding: 4px 10px; margin: 0; font-size: 12px; border-width: 2px; box-shadow: 2px 2px 0 #000; }
#statsView { position: fixed; inset: 0; background: rgba(29,29,27,0.88); justify-content: center; align-items: center; z-index: 3500; }
.stat-table { width: 100%; border-collapse: collapse; margin: 14px 0 6px; font-size: 16px; }
.stat-table th { padding: 6px 4px; font-size: 15px; border-bottom: 3px solid #1d1d1b; }
.stat-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #cdbf9d; }
.stat-table td:first-child { text-align: left; color: #3a362e; }
.stat-table .lead { font-weight: bold; color: #a3401f; }
.stat-note { text-align: center; color: #3a362e; margin: 8px 0 14px; }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 #1d1d1b; }
.controls { line-height: 1.8; color: #3a362e; margin: 22px 12px 12px; }
.abilities { color: #a3401f; font-weight: bold; }
.credit { position: fixed; bottom: 5px; right: 5px; font-size: 10px; color: #dce6f5; background: rgba(0,0,0,0.4); padding: 4px 7px; border-radius: 5px; z-index: 1000; }
#menuBg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; border: none; border-radius: 0; box-shadow: none; z-index: 0; }
#menu { position: fixed; inset: 0; background: #2b6f73; display: flex; justify-content: center; align-items: center; z-index: 2000; }
.menu-content { position: relative; z-index: 1; background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 32px; width: 92%; max-width: 450px; max-height: 92vh; overflow-y: auto; }
.menu-content h1 { font-size: 35px; margin-bottom: 10px; }
.menu-content p { color: #3a362e; margin-bottom: 20px; }
.menu-button { display: block; width: 100%; margin: 12px auto; padding: 16px; font-size: 20px; }
.back-button { font-size: 15px; padding: 10px; background: #e3d6b8; }
.back-button:hover { background: #ebe0c7; }
#gameArea { display: none; }
#briefing { position: fixed; inset: 0; background: rgba(29,29,27,0.88); display: flex; justify-content: center; align-items: center; z-index: 3000; }
.brief-card { background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 22px 26px; width: 94%; max-width: 580px; max-height: 92vh; overflow-y: auto; text-align: left; }
.brief-card h1 { text-align: center; font-size: 30px; margin: 0; }
.brief-card h2 { text-align: center; margin: 2px 0 10px; font-size: 16px; color: #c9501f; letter-spacing: 1px; text-transform: uppercase; }
.brief-card .controls { margin: 6px 0; line-height: 1.55; font-size: 14px; }
.brief-card ul { margin: 6px 0 12px 18px; padding: 0; }
.brief-card li { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="credit">by yash</div>

<div id="menu">
<canvas id="menuBg"></canvas>
<button class="legacy-btn" onclick="openLegacy()">Legacy</button>
<div class="menu-content">
<h1>Study Guide</h1>

<div id="modeStep">
<p>Select your game mode!</p>
<button class="menu-button" onclick="chooseMode(1)">1 VS 1</button>
<button class="menu-button" onclick="chooseMode(2)">2 VS 2</button>
</div>

<div id="oppStep" style="display:none">
<p id="oppPrompt">Who are you playing against?</p>
<button class="menu-button" id="sameKbBtn" onclick="chooseOpponent('local')">With a Friend</button>
<button class="menu-button" id="soloBotBtn" onclick="chooseOpponent('bot')">Solo (vs Bot)</button>
<button class="menu-button back-button" onclick="showModeStep()">← BACK</button>
</div>

<div id="diffStep" style="display:none">
<p>Pick a bot difficulty!</p>
<button class="menu-button" onclick="chooseDifficulty('easy')">Easy</button>
<button class="menu-button" onclick="chooseDifficulty('medium')">Medium</button>
<button class="menu-button" onclick="chooseDifficulty('hard')">Hard</button>
<button class="menu-button back-button" onclick="chooseMode(1)">← BACK</button>
</div>

<div id="sportStep" style="display:none">
<p>Select your sport!</p>
<button class="menu-button" onclick="hostOrLocalStart('volleyball')">Volleyball</button>
<button class="menu-button" onclick="hostOrLocalStart('badminton')">Badminton</button>
<button class="menu-button" onclick="hostOrLocalStart('basketball')">Basketball</button>
<button class="menu-button back-button" onclick="backFromSport()">← BACK</button>
</div>
</div>
</div>

<div id="gameArea">
<h1 id="gameTitle">Study Guide</h1>
<div id="score">0 - 0</div>
<canvas id="game" width="900" height="500"></canvas>
<button id="restartBtn" onclick="restart()">RESTART GAME</button>
<button id="menuBtn" onclick="backToMenu()">MAIN MENU</button>
<button id="helpBtn" onclick="openBriefing()">HOW TO PLAY</button>
<button id="soundBtn" onclick="toggleSound(); this.blur()">SOUND: ON</button>
<div class="controls" id="controlsDisplay"></div>
</div>

<div id="statsView" style="display:none">
<div class="brief-card">
<h1 id="statsTitle"></h1>
<div id="statsBody"></div>
<button class="menu-button" onclick="restart()">PLAY AGAIN</button>
<button class="menu-button back-button" onclick="backToMenu()">MAIN MENU</button>
</div>
</div>

<div id="legacyView"><button class="legacy-back" onclick="closeLegacy()">&larr; Back</button><iframe id="legacyFrame" title="Legacy"></iframe></div>

<div id="briefing" style="display:none">
<div class="brief-card">
<h1>Study Guide</h1>
<h2 id="briefTitle"></h2>
<div class="controls" id="briefBody"></div>
<button class="menu-button" onclick="closeBriefing()">READY</button>
</div>
</div>

document.addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (legacyOpen) return;
  const key = normalizeKey(e);
  if (key === "m" && gameStarted) { toggleSound(); return; }
  if (statsOpen) { if (key === "enter") { e.preventDefault(); restart(); } return; }
  if (briefingOpen) { if (key === "enter") { e.preventDefault(); closeBriefing(); } return; }
  if (key === "escape") { e.preventDefault(); togglePause(); return; }
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","enter","shift"].includes(key) || key.startsWith("numpad")) e.preventDefault();
  if (!keys[key]) {
    pressed[key] = true;
  }
  keys[key] = true;
});
document.addEventListener("keyup", e => { keys[normalizeKey(e)] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// Summary of this topic for exam revision.
function readKeys(p, m) {
  const held = a => a.some(k => keys[k]);
  const edge = a => a.some(k => pressed[k]);
  const n = p.in;
  n.left = held(m.left); n.right = held(m.right);
  n.jump = edge(m.jump); n.slide = edge(m.slide); n.set = edge(m.set); n.spike = edge(m.spike);
  n.spikeHeld = held(m.spike);
  n.setHeld = held(m.set);
}

// Review the key terms before moving on to the next chapter.
function drawMenuItem(it) {
  mctx.save(); mctx.translate(it.x, it.y); mctx.rotate(it.a);
  const s = it.r / 15; mctx.scale(s, s);
  mctx.lineWidth = 2; mctx.lineCap = "round"; mctx.strokeStyle = "#1d1d1b";
  if (it.kind === "volley") {
    mctx.fillStyle = "#f4ecd8";
    mctx.beginPath(); mctx.arc(0, 0, 15, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.beginPath(); mctx.arc(0, 0, 10, 0, Math.PI * 2); mctx.moveTo(-15, 0); mctx.lineTo(15, 0); mctx.moveTo(0, -15); mctx.lineTo(0, 15); mctx.stroke();
  } else if (it.kind === "hoop") {
    mctx.fillStyle = "#e07b2a";
    mctx.beginPath(); mctx.arc(0, 0, 15, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.beginPath(); mctx.moveTo(-15, 0); mctx.lineTo(15, 0); mctx.moveTo(0, -15); mctx.lineTo(0, 15); mctx.stroke();
    mctx.beginPath(); mctx.arc(-17, 0, 14, -0.9, 0.9); mctx.stroke();
    mctx.beginPath(); mctx.arc(17, 0, 14, Math.PI - 0.9, Math.PI + 0.9); mctx.stroke();
  } else if (it.kind === "birdie") {
    mctx.fillStyle = "#ffffff";
    mctx.beginPath(); mctx.moveTo(4, -5); mctx.lineTo(-17, -13); mctx.lineTo(-17, 13); mctx.lineTo(4, 5); mctx.closePath(); mctx.fill(); mctx.stroke();
    mctx.fillStyle = "#e8c27a";
    mctx.beginPath(); mctx.arc(8, 0, 7, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
  } else {
    mctx.lineWidth = 3.5; mctx.beginPath(); mctx.moveTo(0, 26); mctx.lineTo(0, 10); mctx.stroke();
    mctx.lineWidth = 2.5; mctx.fillStyle = "rgba(255,255,255,0.3)";
    mctx.beginPath(); mctx.ellipse(0, -5, 11, 16, 0, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.lineWidth = 1; mctx.beginPath();
    for (let x = -6; x <= 6; x += 4) { mctx.moveTo(x, -17); mctx.lineTo(x, 7); }
    for (let y = -14; y <= 4; y += 5) { mctx.moveTo(-9, y); mctx.lineTo(9, y); }
    mctx.stroke();
  }
  mctx.restore();
}

function menuBgFrame(t) {
  if (document.getElementById("menu").style.display !== "none") {
    const w = mbg.width, h = mbg.height;
    mctx.fillStyle = "#2b6f73"; mctx.fillRect(0, 0, w, h);
    mctx.fillStyle = "#327a7e";
    const off = (t * 0.03) % 120;
    for (let x = -h + off; x < w; x += 120) {
      mctx.beginPath(); mctx.moveTo(x, 0); mctx.lineTo(x + 60, 0); mctx.lineTo(x + 60 + h, h); mctx.lineTo(x + h, h); mctx.fill();
    }
    mItems.forEach(it => {
      it.x += it.vx; it.y += it.vy; it.a += it.va;
      if (it.x < -60) it.x = w + 60; if (it.x > w + 60) it.x = -60;
      if (it.y < -60) it.y = h + 60; if (it.y > h + 60) it.y = -60;
      drawMenuItem(it);
    });
  }
  requestAnimationFrame(menuBgFrame);
}

function predictLanding() {
  const S = SPORTS[sport];
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  const r = ball.r;
  for (let i = 0; i < 400; i++) {
    vy += S.g;
    if (S.k) { const f = S.k * Math.hypot(vx, vy); vx -= vx * f; vy -= vy * f; }
    x += vx; y += vy;
    if (x < r) { x = r; vx *= -0.85; }
    if (x > WIDTH - r) { x = WIDTH - r; vx *= -0.85; }
    if (y < r) { y = r; vy *= -0.85; }
    if (Math.abs(x - netX) < r + 5 && y + r > netTop) {
      if (y < netTop && vy > 0) { y = netTop - r; vy *= -0.6; }
      else { x = x < netX ? netX - 5 - r : netX + 5 + r; vx *= -0.8; }
    }
    if (!S.k) vx *= 0.999;
    if (y + r >= ground) return { x, t: i };
  }
  return { x, t: 400 };
}

    sd = p.in.left ? -1 : (p.in.right ? 1 : dir);
    const vy0 = sport === "volleyball" ? -Math.min(-S.setV[1], Math.sqrt(0.5 * Math.max(ball.y - 30, 25))) : S.setV[1];
    let vx0 = sd * S.setV[0] + p.vx * 0.2;
    if (sport === "volleyball" && fwd) {
      const tx = netX - dir * 38, ys = netTop - 70, disc = vy0 * vy0 + 2 * S.g * (ys - ball.y);
      const t = disc > 0 ? (-vy0 + Math.sqrt(disc)) / S.g : -vy0 / S.g;
      const dist = dir * (tx - (ball.x + dir * 8));
      vx0 = dir * Math.max(0.5, Math.min(9, dist / t));
      label = "NET SET";
    }
    ball.vx = vx0; ball.vy = vy0;
  }
  ball.x += sd * 8;
  abilityEffect(p, label);
  if (label === "DROP") sfx.drop(); else sfx.set();
}

// Revision tip: repeat difficult topics at spaced intervals.
function spikeBall(p, power = 1) {
  if (p.spikeCooldown > 0 || !canHit(p) || ballDistance(p) > SPORTS[sport].hitReach) return;
  if (lastHitTick === matchTicks) return;
  const air = p.y < ground - 62, dir = p.side === 0 ? 1 : -1;
  let vx, vy, label;
  if (sport === "volleyball") {
    if (!air || serveInProgress) return;
    if (touchFault(p)) return;
    const toward = p.isBot ? p.in.style === "cut" : (p.side === 0 ? p.in.right : p.in.left);
    const away = p.isBot ? p.in.style === "deep" : (p.side === 0 ? p.in.left : p.in.right);
    if (toward) { const r = planSpike(dir, [[3, 14], [4, 14], [5, 14], [6, 14], [7, 14], [8.5, 14]], 20, 90); vx = r.vx; vy = r.vy; label = "CUT"; }
    else if (away) { const r = planSpike(dir, [[13.5, 4], [13.5, 7], [12, 7], [12, 9], [10.5, 9], [10.5, 11], [9, 11]], 250, 400); vx = r.vx; vy = r.vy; label = "DEEP"; }
    else { const r = planSpike(dir, [[9, 11], [8, 11], [10, 11], [7, 11], [12, 11]], 100, 280); vx = r.vx; vy = r.vy; label = "SPIKE"; }
  } else {
    const deg = SMASH.a0 + (SMASH.a1 - SMASH.a0) * power;
    const a = deg * Math.PI / 180;
    let sp = SMASH.s0 + (SMASH.s1 - SMASH.s0) * power;
    if (power >= 0.5) { smashStreak[p.side]++; sp = Math.min(38, sp * (1 + 0.12 * Math.min(smashStreak[p.side] - 1, 4))); }
    vx = dir * Math.cos(a) * sp; vy = -Math.sin(a) * sp;
    if (power < 0.7) vy = clearNetVy(Math.abs(vx), vy, 16, 0.115, 14);
    label = power < 0.5 ? "CLEAR" : "SMASH " + Math.round(power * 100) + "%";
  }
  registerHit(p, sport === "badminton" && power >= 0.5);
  const bSmash = sport === "badminton" && power >= 0.5;
  if (bSmash) { streakOwner[p.side] = players.indexOf(p); stats[p.side].bestStreak = Math.max(stats[p.side].bestStreak, smashStreak[p.side]); }
  if (sport === "badminton" && !bSmash) stats[p.side].sets++; else stats[p.side].attacks++;
  p.fxColor = bSmash ? streakColor(smashStreak[p.side]) : null;
  p.spikeCooldown = sport === "badminton" ? 30 : 50;
  ball.vx = vx + p.vx * 0.2; ball.vy = vy;
  ball.x += dir * 12;
  abilityEffect(p, label);
  createParticles(ball.x, ball.y, p.fxColor || "#ffd166", 18 + (bSmash ? 5 * Math.min(smashStreak[p.side], 5) : 0));
  if (bSmash) sfx.attack(smashStreak[p.side]); else if (sport === "badminton") sfx.set(); else sfx.attack(label === "DEEP" ? 1 : 0);
}

// Glossary: definitions to memorise for the test.
function movePlayers() {
  const S = SPORTS[sport];
  players.forEach(p => {
    const n = p.in;
    p.setCooldown = Math.max(0, p.setCooldown - 1);
    p.spikeCooldown = Math.max(0, p.spikeCooldown - 1);
    p.effectTimer = Math.max(0, p.effectTimer - 1);
    if (p.effectTimer === 0) p.effect = "";

    if (n.slide) slide(p);
    if (sport === "basketball") hoopActions(p);
    else if (n.set) setBall(p);
    if (sport === "volleyball") {
      const serving = serveInProgress && !serveHit && p.side === servingSide;
      p.serveBuf = Math.max(0, (p.serveBuf || 0) - 1);
      if (serving && n.spike) p.serveBuf = 10;
      if (serving && p.serveBuf > 0) jumpServe(p);
    }

    if (sport === "basketball") {
    } else if (sport === "badminton") {

      if (n.spike && p.spikeCooldown === 0) { p.charging = true; p.charge = 0; }
      if (p.charging) {
        if (n.spikeHeld) p.charge = Math.min(1, p.charge + 1 / 16);
        else { p.charging = false; spikeBall(p, p.charge); p.charge = 0; }
      }
    } else if (n.spike) spikeBall(p, 1);

    if (p.slideTimer > 0) p.slideTimer--;
    else if (!p.stun) { if (n.left) p.x -= 5; if (n.right) p.x += 5; }

    if (n.jump && p.y >= ground - 60 && !p.stun) { p.vy = -S.jump; p.slideTimer = 0; }

    p.vy += 0.55;
    p.y += p.vy;
    if (p.y > ground - 60) { p.y = ground - 60; p.vy = 0; }

    p.x = Math.max(25, Math.min(875, p.x));
    if (sport !== "basketball") { if (p.side === 0) p.x = Math.min(p.x, netX - 30); else p.x = Math.max(p.x, netX + 30); }

    if (p.slideTimer > 0) { p.x += p.vx; p.vx *= 0.88; } else p.vx = 0;
  });
}

// Study schedule: break the reading into short sessions.
function collideBall() {
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    const dx = ball.x - p.x, dy = ball.y - (p.y - 10);
    const dist = Math.hypot(dx, dy);
    const minDist = ball.r + (p.slideTimer > 0 ? 32 : p.radius);

    const touching = dist < minDist && dist > 0;
    if (hitShield > 0 && p.side === lastHitSide) { playerTouchingBall[i] = touching; continue; }
    if (!touching) { playerTouchingBall[i] = false; continue; }
    if (playerTouchingBall[i]) continue;
    playerTouchingBall[i] = true;

    const dir = p.side === 0 ? 1 : -1, S = SPORTS[sport];

    if (serveInProgress) {
      if (!serveHit && p.side !== servingSide) { awardPoint(servingSide); return; }

      if (!serveHit && p.side === servingSide) {
        serveHit = true; servePlayerIndex = i;
        lastHitSide = p.side; ball.bnc = 0; hitShield = 10; touches[p.side] = 0;
        stats[p.side].hits++; rally++; sfx.serve();
        ball.vx = dir * S.serve[0]; ball.vy = S.serve[1];
        const nx = dx / dist, ny = dy / dist;
        ball.x = p.x + nx * minDist; ball.y = p.y - 10 + ny * minDist;
        createParticles(ball.x, ball.y, p.color, 5);
        return;
      }
      if (serveHit && p.side === servingSide) { awardPoint(p.side === 0 ? 1 : 0); return; }
      if (p.side !== servingSide) serveInProgress = false;
    }

    const nx = dx / dist, ny = dy / dist;
    ball.x = p.x + nx * minDist; ball.y = p.y - 10 + ny * minDist;
    if (lastHitTick === matchTicks) continue;
    if (touchFault(p)) return;
    registerHit(p);

    const speed = Math.hypot(ball.vx, ball.vy);
    const floor = sport === "badminton" ? 12 : 6;
    ball.vx = nx * Math.max(speed, floor) + p.vx * 0.3;
    ball.vy = ny * Math.max(speed, floor) - 1;
    createParticles(ball.x, ball.y, p.color, 5);
    sfx.hit();
  }
}

// Mnemonic to help remember this section.
function groundContact() {
  awardPoint(ball.x < netX ? 1 : 0);
}

// Past-paper style question for self-assessment.
function updateBall() {
  if (ball.vx === 0 && ball.vy === 0) { collideBall(); return; }
  if (hitShield > 0) hitShield--;
  const S = SPORTS[sport];

  ball.vy += S.g;
  if (S.k) { const f = S.k * Math.hypot(ball.vx, ball.vy); ball.vx -= ball.vx * f; ball.vy -= ball.vy * f; }
  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.85; }
  if (ball.x > WIDTH - ball.r) { ball.x = WIDTH - ball.r; ball.vx *= -0.85; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -0.85; }

  if (Math.abs(ball.x - netX) < ball.r + 5 && ball.y + ball.r > netTop) {
    if (ball.y < netTop && ball.vy > 0) { ball.y = netTop - ball.r; ball.vy *= -0.6; sfx.net(); }
    else { ball.x = ball.x < netX ? netX - 5 - ball.r : netX + 5 + ball.r; ball.vx *= -0.8; sfx.net(); }
  }

  collideBall();
  if (ball.y + ball.r >= ground) groundContact();
  if (!S.k) ball.vx *= 0.999;
}

// Cross-reference with the textbook chapter.
function updateParticles() {
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });

// Flashcards: quiz yourself, then check the answer.
function drawArms(p) {
  const d = p.side === 0 ? 1 : -1, kind = (p.effect || "").split(" ")[0], t = p.effectTimer / 30;

    const gx = p.x + away * (p.radius + 20), top = p.y - 60, gh = 84, gw = 10;

// Practice questions - attempt before reading the solution.
function drawRacquet(p) {
  const d = p.side === 0 ? 1 : -1, kind = (p.effect || "").split(" ")[0];
  let a = -1.0;
  if (p.slideTimer > 0) a = 0.1;
  else if (p.effectTimer > 0) a = ["SPIKE","SMASH","CUT","DEEP","JUMP"].includes(kind) ? 0.6 : -1.5;
  const theta = d === 1 ? a : Math.PI - a;
  const sx = p.x + d * 14, sy = p.y - 2, handle = 16;
  const hx = sx + Math.cos(theta) * handle, hy = sy + Math.sin(theta) * handle;
  const rx = 15, ry = 10;
  const cx = hx + Math.cos(theta) * rx, cy = hy + Math.sin(theta) * rx;

  ctx.lineCap = "round"; ctx.strokeStyle = "#222"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(theta);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(40,40,40,0.55)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -rx + 5; x < rx - 3; x += 5) { ctx.moveTo(x, -ry + 2); ctx.lineTo(x, ry - 2); }
  for (let y = -ry + 4; y < ry - 2; y += 5) { ctx.moveTo(-rx + 3, y); ctx.lineTo(rx - 3, y); }
  ctx.stroke();
  ctx.strokeStyle = "#555"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// Study schedule: break the reading into short sessions.
function drawCues() {
  if (!gameStarted || gameOver) return;
  if (sport === "basketball") { drawHoopCues(); return; }
  const S = SPORTS[sport];
  let canSet = false, canSpike = false;
  for (const p of players) {
    if (!canHit(p)) continue;
    const d = ballDistance(p);
    if (d < S.setReach) canSet = true;
    if (d < S.hitReach && (sport !== "volleyball" || (p.y < ground - 62 && !serveInProgress))) canSpike = true;
  }
  if (canSet || canSpike) {
    const col = canSpike ? "#e8382a" : "#f2b134";
    const rad = 26 + Math.sin(performance.now() / 110) * 2.5;
    ctx.save();
    ctx.setLineDash([6, 5]); ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
    ctx.fillText(canSpike ? S.spikeName : S.setName, ball.x, ball.y - rad - 6);
    ctx.restore();
  }
  for (const p of players) {
    if (p.effectTimer < 22) continue;
    const kind = (p.effect || "").split(" ")[0];
    const strong = ["SPIKE","SMASH","CUT","DEEP","JUMP"].includes(kind);
    if (!strong && !["SET","NET","DROP","CLEAR"].includes(kind)) continue;
    const k = (p.effectTimer - 21) / 9;
    ctx.save();
    ctx.globalAlpha = k; ctx.strokeStyle = strong ? (p.fxColor || "#e8382a") : "#f2b134"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 16 + (1 - k) * 34, 0, Math.PI * 2); ctx.stroke();
    if (strong) {
      const sp = Math.hypot(ball.vx, ball.vy) || 1, ux = ball.vx / sp, uy = ball.vy / sp;
      ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(ball.x - ux * 22 - uy * i * 7, ball.y - uy * 22 + ux * i * 7);
        ctx.lineTo(ball.x - ux * 52 - uy * i * 7, ball.y - uy * 52 + ux * i * 7);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawHoops() {

  ctx.beginPath(); ctx.moveTo(netX, ground); ctx.lineTo(netX, ground + 55); ctx.stroke();
  hoops.forEach(h => {
    const x3 = hoopCx(h) + h.d * THREE_DIST;
    ctx.fillStyle = "rgba(201,80,31,0.35)"; ctx.fillRect(Math.min(h.bx, h.bx + h.d * 190), ground, 190, 55);
    ctx.setLineDash([6, 5]); ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x3, ground + 2); ctx.lineTo(x3, ground + 55); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x3, 140); ctx.lineTo(x3, ground); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#555"; ctx.fillRect(h.bx - h.d * 12 - 3, ry - 10, 6, ground - (ry - 10));
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(h.bx - 3, ry - 85, 6, 93);
    ctx.strokeStyle = "#c9501f"; ctx.lineWidth = 2; ctx.strokeRect(h.bx - 3, ry - 85, 6, 93);
    const bk = hoopBack(h), fr = hoopFront(h);
    ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.5;
    for (let i = 0; i <= 4; i++) {
      const xt = bk + (fr - bk) * i / 4, xb = bk + (fr - bk) * (0.2 + 0.6 * i / 4);
      ctx.beginPath(); ctx.moveTo(xt, ry); ctx.lineTo(xb, ry + 32); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(bk + (fr - bk) * 0.07, ry + 14); ctx.lineTo(bk + (fr - bk) * 0.93, ry + 14); ctx.stroke();
    ctx.strokeStyle = "#e8532a"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(bk, ry); ctx.lineTo(fr, ry); ctx.stroke();
  });
  ctx.restore();
}

function drawHoopCues() {
  shockFx.forEach(f => {
    ctx.save(); ctx.globalAlpha = 1 - f.t / 14; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(f.x, f.y, 24 + f.t * 4.5, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  });
  if (scoreWait > 0) return;
  const pulse = Math.sin(performance.now() / 110) * 2.5;
  ctx.save(); ctx.textAlign = "center"; ctx.font = "bold 12px Arial";
  if (holder >= 0) {
    const h = players[holder];
    if (!h.charging) {
      const r = 22 + pulse;
      ctx.setLineDash([6, 5]); ctx.strokeStyle = "#f2b134"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#f2b134"; ctx.fillText("SHOOT", ball.x, ball.y - r - 6);
    }
    const near = players.some(q => q.side !== h.side && q.stealCD === 0 && Math.hypot(h.x - q.x, h.y - q.y) <= 90);
    if (near) {
      const r = 36 + pulse, safe = h.immune > 0, col = safe ? "#ffffff" : "#e8382a";
      ctx.setLineDash([4, 5]); ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = col; ctx.fillText(safe ? "SAFE" : "STEAL", ball.x, ball.y + r + 14);
    }
  } else if (airborneBall()) {
    const live = !shotLive || shotAge >= SHOT_SAFE, r = 24 + pulse;
    if (live) {
      ctx.setLineDash([6, 4]); ctx.strokeStyle = "#e8382a"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = "#e8382a"; ctx.fillText("STEAL", ball.x, ball.y - r - 6);
    } else {
      ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 24, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, shotAge / SHOT_SAFE)); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawBasketball() {
  for (let i = 0; i < ballTrail.length; i++) {
    const t = ballTrail[i], k = (i + 1) / ballTrail.length;
    ctx.globalAlpha = 0.45 * k; ctx.fillStyle = "#ff9a3c";
    ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (0.3 + 0.6 * k), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#e07b2a";
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#2a1608"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ball.x - ball.r, ball.y); ctx.lineTo(ball.x + ball.r, ball.y); ctx.moveTo(ball.x, ball.y - ball.r); ctx.lineTo(ball.x, ball.y + ball.r); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x - ball.r * 1.2, ball.y, ball.r * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x + ball.r * 1.2, ball.y, ball.r * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
}

function drawTouches() {
  if (sport !== "volleyball" || gameMode !== 2) return;
  [0, 1].forEach(side => {
    const n = lastHitSide === side && !serveInProgress ? touches[side] : 0;
    for (let i = 0; i < 3; i++) {
      const x = side === 0 ? 24 + i * 18 : WIDTH - 24 - i * 18;
      ctx.beginPath(); ctx.arc(x, 24, 6, 0, Math.PI * 2);
      ctx.fillStyle = i < n ? (n >= 3 ? "#e8382a" : "#f2b134") : "rgba(255,255,255,0.35)";
      ctx.fill(); ctx.strokeStyle = "#1d1d1b"; ctx.lineWidth = 2; ctx.stroke();
    }
  });
  if (notice && performance.now() < notice.until) {
    ctx.save(); ctx.font = "bold 34px Arial"; ctx.textAlign = "center"; ctx.lineWidth = 5; ctx.strokeStyle = "#1d1d1b";
    ctx.strokeText(notice.text, WIDTH / 2, 150); ctx.fillStyle = "#ffd166"; ctx.fillText(notice.text, WIDTH / 2, 150); ctx.restore();
  }
}

// Mnemonic to help remember this section.
function drawPaused() {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 52px Arial"; ctx.textAlign = "center";
  ctx.fillText("PAUSED", WIDTH / 2, 230);
  ctx.fillStyle = "white"; ctx.font = "22px Arial";
  ctx.fillText("Press Escape to continue", WIDTH / 2, 275);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 48px Arial"; ctx.textAlign = "center";
  ctx.fillText(score1 > score2 ? "BLUE WINS!" : "RED WINS!", WIDTH / 2, 250);
}

// Past-paper style question for self-assessment.
function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  drawCourt();
  players.forEach(drawPlayer);
  drawBall();
  drawCues();
  drawTouches();
  drawParticles();
  if (gameOver) drawGameOver();
  if (paused) drawPaused();
}

const STEP = 1000 / 60;
let lastTime = 0, acc = 0;

// Cross-reference with the textbook chapter.
function loop(t = 0) {
  acc += Math.min(t - lastTime, 100);
  lastTime = t;
  while (acc >= STEP) {
    if (gameStarted && !briefingOpen && !paused && !gameOver) {
      matchTicks++; gatherInputs(); botControl(); movePlayers(); if (sport === "basketball") updateBasketball(); else updateBall(); updateParticles();
    }
    for (const key in pressed) delete pressed[key];
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
