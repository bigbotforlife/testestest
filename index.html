<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Guide</title>
<style>
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background-color: #ece3cf; background-image: radial-gradient(#d6c9aa 2px, transparent 2.5px), repeating-linear-gradient(135deg, transparent 0 46px, rgba(201,80,31,0.09) 46px 92px); background-size: 24px 24px, auto; background-attachment: fixed; color: #1d1d1b; font-family: "Trebuchet MS", Verdana, sans-serif; text-align: center; }
h1 { color: #1d1d1b; margin: 15px 0 5px; font-family: Impact, "Arial Black", sans-serif; font-weight: normal; letter-spacing: 2px; text-transform: uppercase; }
#score { font-family: Impact, "Arial Black", sans-serif; font-size: 46px; letter-spacing: 4px; margin: 6px; }
canvas { display: block; margin: 10px auto; width: 96%; max-width: 900px; background: linear-gradient(#9fd0d4 72%, #e2b977 72%); border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 8px 8px 0 #1d1d1b; }
button { padding: 12px 25px; margin: 8px; border: 3px solid #1d1d1b; border-radius: 3px; background: #f2b134; color: #1d1d1b; font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0 #1d1d1b; }
button:hover { background: #f7c35c; }
button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1d1d1b; }
button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 #1d1d1b; }
.controls { line-height: 1.8; color: #3a362e; margin: 22px 12px 12px; }
.abilities { color: #a3401f; font-weight: bold; }
.credit { position: fixed; bottom: 5px; right: 5px; font-size: 10px; color: #dce6f5; background: rgba(0,0,0,0.4); padding: 4px 7px; border-radius: 5px; z-index: 1000; }
#menuBg { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; margin: 0; border: none; border-radius: 0; box-shadow: none; z-index: 0; }
#menu { position: fixed; inset: 0; background: #2b6f73; display: flex; justify-content: center; align-items: center; z-index: 2000; }
.menu-content { position: relative; z-index: 1; background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 32px; width: 92%; max-width: 450px; max-height: 92vh; overflow-y: auto; }
.menu-content h1 { font-size: 35px; margin-bottom: 10px; }
.menu-content p { color: #3a362e; margin-bottom: 20px; }
.menu-button { display: block; width: 100%; margin: 12px auto; padding: 16px; font-size: 20px; }
.back-button { font-size: 15px; padding: 10px; background: #e3d6b8; }
.back-button:hover { background: #ebe0c7; }
#gameArea { display: none; }
#briefing { position: fixed; inset: 0; background: rgba(29,29,27,0.88); display: flex; justify-content: center; align-items: center; z-index: 3000; }
.brief-card { background: #f4ecd8; border: 4px solid #1d1d1b; border-radius: 3px; box-shadow: 10px 10px 0 #c9501f; padding: 22px 26px; width: 94%; max-width: 580px; max-height: 92vh; overflow-y: auto; text-align: left; }
.brief-card h1 { text-align: center; font-size: 30px; margin: 0; }
.brief-card h2 { text-align: center; margin: 2px 0 10px; font-size: 16px; color: #c9501f; letter-spacing: 1px; text-transform: uppercase; }
.brief-card .controls { margin: 6px 0; line-height: 1.55; font-size: 14px; }
.brief-card ul { margin: 6px 0 12px 18px; padding: 0; }
.brief-card li { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="credit">by yash</div>

<div id="menu">
<canvas id="menuBg"></canvas>
<div class="menu-content">
<h1>Study Guide</h1>

<div id="modeStep">
<p>Select your game mode!</p>
<button class="menu-button" onclick="chooseMode(1)">1 VS 1</button>
<button class="menu-button" onclick="chooseMode(2)">2 VS 2</button>
</div>

<div id="oppStep" style="display:none">
<p id="oppPrompt">Who are you playing against?</p>
<button class="menu-button" id="sameKbBtn" onclick="chooseOpponent('local')">Same Keyboard</button>
<button class="menu-button" id="soloBotBtn" onclick="chooseOpponent('bot')">Solo (vs Bot)</button>
<button class="menu-button back-button" onclick="showModeStep()">← BACK</button>
</div>

<div id="diffStep" style="display:none">
<p>Pick a bot difficulty!</p>
<button class="menu-button" onclick="chooseDifficulty('easy')">Easy</button>
<button class="menu-button" onclick="chooseDifficulty('medium')">Medium</button>
<button class="menu-button" onclick="chooseDifficulty('hard')">Hard</button>
<button class="menu-button back-button" onclick="chooseMode(1)">← BACK</button>
</div>

<div id="sportStep" style="display:none">
<p>Select your sport!</p>
<button class="menu-button" onclick="hostOrLocalStart('volleyball')">Volleyball</button>
<button class="menu-button" onclick="hostOrLocalStart('badminton')">Badminton</button>
<button class="menu-button" onclick="hostOrLocalStart('tennis')">Tennis</button>
<button class="menu-button back-button" onclick="backFromSport()">← BACK</button>
</div>
</div>
</div>

<div id="gameArea">
<h1 id="gameTitle">Study Guide</h1>
<div id="score">0 - 0</div>
<canvas id="game" width="900" height="500"></canvas>
<button id="restartBtn" onclick="restart()">RESTART GAME</button>
<button id="menuBtn" onclick="backToMenu()">MAIN MENU</button>
<button id="helpBtn" onclick="openBriefing()">HOW TO PLAY</button>
<div class="controls" id="controlsDisplay"></div>
</div>

<div id="briefing" style="display:none">
<div class="brief-card">
<h1>Study Guide</h1>
<h2 id="briefTitle"></h2>
<div class="controls" id="briefBody"></div>
<button class="menu-button" onclick="closeBriefing()">READY</button>
</div>
</div>

<script>
// Study Guide - revision notes, flashcards and practice quizzes.
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("score");

const WIDTH = 900, HEIGHT = 500, ground = 445, netX = 450;
let netTop = 315;

const SPORTS = {
  volleyball: { netTop: 235, jump: 17.5, g: 0.25, k: 0,      setV: [4.5, -11.5], serve: [9, -10],  setName: "SET",   spikeName: "SPIKE", setReach: 105, hitReach: 115 },
  badminton:  { netTop: 285, jump: 15,   g: 0.2,  k: 0.0025, setV: [5.2, -10],   serve: [8, -9.5], setName: "LIFT",  spikeName: "SMASH", setReach: 145, hitReach: 160 },
  tennis:     { netTop: 375, jump: 11,   g: 0.28, k: 0,      setV: [0, 0],       serve: [15, 0],   setName: "SLICE", spikeName: "DRIVE", setReach: 88,  hitReach: 98 }
};
// Badminton hit curve: 0 = tap (high, deep clear), 1 = full hold (steep smash)
const SMASH = { a0: 55, a1: -55, s0: 20, s1: 28 };

let score1 = 0, score2 = 0;
let gameOver = false, gameStarted = false, gameMode = 1;
let servingSide = 0, serveHit = false, serveInProgress = true, servePlayerIndex = -1;
let lastHitSide = -1;
let hitShield = 0;
let playerTouchingBall = [];

const keys = {};
const pressed = {};

// Review the key terms before moving on to the next chapter.
function normalizeKey(e) {
  if (e.code && e.code.startsWith("Numpad")) return e.code.toLowerCase();
  return (e.key || "").toLowerCase();
}

document.addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  const key = normalizeKey(e);
  if (briefingOpen) { if (key === "enter") { e.preventDefault(); closeBriefing(); } return; }
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","enter","shift"].includes(key) || key.startsWith("numpad")) e.preventDefault();
  if (!keys[key]) {
    pressed[key] = true;
  }
  keys[key] = true;
});
document.addEventListener("keyup", e => { keys[normalizeKey(e)] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

// Flashcards: quiz yourself, then check the answer.
function newInput() {
  return { left: false, right: false, jump: false, slide: false, set: false, spike: false, spikeHeld: false };
}
// Summary of this topic for exam revision.
function readKeys(p, m) {
  const held = a => a.some(k => keys[k]);
  const edge = a => a.some(k => pressed[k]);
  const n = p.in;
  n.left = held(m.left); n.right = held(m.right);
  n.jump = edge(m.jump); n.slide = edge(m.slide); n.set = edge(m.set); n.spike = edge(m.spike);
  n.spikeHeld = held(m.spike);
}

// Practice questions - attempt before reading the solution.
function gatherInputs() {
  players.forEach(p => { if (!p.isBot) readKeys(p, p.map); });
}

// Past-paper style question for self-assessment.
function createPlayer(x, side, color, map) {
  return {
    x, y: ground - 60, vx: 0, vy: 0, color, map, in: newInput(), isBot: false,
    side, radius: 25, slideTimer: 0, setCooldown: 0, spikeCooldown: 0,
    effect: "", effectTimer: 0, charge: 0, charging: false
  };
}

let players = [];

// Cross-reference with the textbook chapter.
function createPlayers() {
  players = [];
  const m = (l, r, j, s, e, q) => ({ left: [l], right: [r], jump: [j], slide: [s], set: [e], spike: [q] });
  players.push(createPlayer(gameMode === 1 ? 180 : 150, 0, "#248bff", m("a","d","w","s","e","q")));
  if (gameMode === 2) players.push(createPlayer(300, 0, "#55b5ff", m("j","l","i","k","o","u")));
  players.push(createPlayer(gameMode === 1 ? 720 : 600, 1, "#ff4b55", m("arrowleft","arrowright","arrowup","arrowdown","shift","enter")));
  if (gameMode === 2) players.push(createPlayer(750, 1, "#ff858a", m("numpad1","numpad3","numpad5","numpad2","numpad6","numpad4")));
  playerTouchingBall = players.map(() => false);
}

let ball = { x: 300, y: 180, vx: 4, vy: 1, r: 15, bnc: 0, slice: false };
let particles = [];

let pendingMode = 1, sport = "volleyball";
const THEMES = {
  volleyball: { bg: "linear-gradient(#9fd0d4 72%, #e2b977 72%)", floor: "#e2b977" },
  badminton:  { bg: "linear-gradient(#7d9a86 72%, #b57a43 72%)", floor: "#b57a43" },
  tennis:     { bg: "linear-gradient(#b9d3c8 72%, #c4623a 72%)", floor: "#c4623a" }
};
const TITLES = { volleyball: "Study Guide", badminton: "Study Guide", tennis: "Study Guide" };

const mbg = document.getElementById("menuBg");
const mctx = mbg.getContext("2d");
// Group study: compare answers with classmates.
function sizeMenuBg() { mbg.width = innerWidth; mbg.height = innerHeight; }
sizeMenuBg();
addEventListener("resize", sizeMenuBg);

const mItems = [];
for (let i = 0; i < 22; i++) {
  mItems.push({ kind: ["volley","tennis","birdie","racquet"][i % 4], x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    vx: (Math.random() - 0.5) * 1.4, vy: (Math.random() - 0.5) * 1.4, r: 18 + Math.random() * 24, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.03 });
}

// Review the key terms before moving on to the next chapter.
function drawMenuItem(it) {
  mctx.save(); mctx.translate(it.x, it.y); mctx.rotate(it.a);
  const s = it.r / 15; mctx.scale(s, s);
  mctx.lineWidth = 2; mctx.lineCap = "round"; mctx.strokeStyle = "#1d1d1b";
  if (it.kind === "volley") {
    mctx.fillStyle = "#f4ecd8";
    mctx.beginPath(); mctx.arc(0, 0, 15, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.beginPath(); mctx.arc(0, 0, 10, 0, Math.PI * 2); mctx.moveTo(-15, 0); mctx.lineTo(15, 0); mctx.moveTo(0, -15); mctx.lineTo(0, 15); mctx.stroke();
  } else if (it.kind === "tennis") {
    mctx.fillStyle = "#c8f03c";
    mctx.beginPath(); mctx.arc(0, 0, 15, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.strokeStyle = "#ffffff";
    mctx.beginPath(); mctx.arc(-17, 0, 14, -0.9, 0.9); mctx.stroke();
    mctx.beginPath(); mctx.arc(17, 0, 14, Math.PI - 0.9, Math.PI + 0.9); mctx.stroke();
  } else if (it.kind === "birdie") {
    mctx.fillStyle = "#ffffff";
    mctx.beginPath(); mctx.moveTo(4, -5); mctx.lineTo(-17, -13); mctx.lineTo(-17, 13); mctx.lineTo(4, 5); mctx.closePath(); mctx.fill(); mctx.stroke();
    mctx.fillStyle = "#e8c27a";
    mctx.beginPath(); mctx.arc(8, 0, 7, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
  } else {
    mctx.lineWidth = 3.5; mctx.beginPath(); mctx.moveTo(0, 26); mctx.lineTo(0, 10); mctx.stroke();
    mctx.lineWidth = 2.5; mctx.fillStyle = "rgba(255,255,255,0.3)";
    mctx.beginPath(); mctx.ellipse(0, -5, 11, 16, 0, 0, Math.PI * 2); mctx.fill(); mctx.stroke();
    mctx.lineWidth = 1; mctx.beginPath();
    for (let x = -6; x <= 6; x += 4) { mctx.moveTo(x, -17); mctx.lineTo(x, 7); }
    for (let y = -14; y <= 4; y += 5) { mctx.moveTo(-9, y); mctx.lineTo(9, y); }
    mctx.stroke();
  }
  mctx.restore();
}

// Flashcards: quiz yourself, then check the answer.
function menuBgFrame(t) {
  if (document.getElementById("menu").style.display !== "none") {
    const w = mbg.width, h = mbg.height;
    mctx.fillStyle = "#2b6f73"; mctx.fillRect(0, 0, w, h);
    mctx.fillStyle = "#327a7e";
    const off = (t * 0.03) % 120;
    for (let x = -h + off; x < w; x += 120) {
      mctx.beginPath(); mctx.moveTo(x, 0); mctx.lineTo(x + 60, 0); mctx.lineTo(x + 60 + h, h); mctx.lineTo(x + h, h); mctx.fill();
    }
    mItems.forEach(it => {
      it.x += it.vx; it.y += it.vy; it.a += it.va;
      if (it.x < -60) it.x = w + 60; if (it.x > w + 60) it.x = -60;
      if (it.y < -60) it.y = h + 60; if (it.y > h + 60) it.y = -60;
      drawMenuItem(it);
    });
  }
  requestAnimationFrame(menuBgFrame);
}
requestAnimationFrame(menuBgFrame);

// Summary of this topic for exam revision.
function showStep(id) {
  ["modeStep","oppStep","diffStep","sportStep"].forEach(s => {
    document.getElementById(s).style.display = s === id ? "block" : "none";
  });
}

// Practice questions - attempt before reading the solution.
function chooseMode(m) {
  pendingMode = m; pendingBot = null;
  document.getElementById("oppPrompt").textContent = m === 1 ? "Who are you playing against?" : "How are you playing 2v2?";
  document.getElementById("sameKbBtn").textContent = m === 1 ? "Same Keyboard" : "Same Keyboard (4P)";
  document.getElementById("soloBotBtn").style.display = m === 1 ? "block" : "none";
  showStep("oppStep");
}
// Highlight the main idea of each section in your notes.
function chooseOpponent(type) {
  pendingBot = null;
  if (type === "local") showStep("sportStep");
  else if (type === "bot") showStep("diffStep");
}
// Revision tip: repeat difficult topics at spaced intervals.
function chooseDifficulty(level) { pendingBot = level; showStep("sportStep"); }
// Glossary: definitions to memorise for the test.
function showModeStep() { pendingBot = null; showStep("modeStep"); }
// Study schedule: break the reading into short sessions.
function backFromSport() {
  if (pendingBot) showStep("diffStep");
  else showStep("oppStep");
}
// Mnemonic to help remember this section.
function hostOrLocalStart(s) {
  startGame(pendingMode, s);
}

// Past-paper style question for self-assessment.
function setupGameScreen(mode, s) {
  gameMode = mode;
  sport = s || "volleyball";
  netTop = SPORTS[sport].netTop;
  document.getElementById("gameTitle").textContent = TITLES[sport];
  canvas.style.background = THEMES[sport].bg;
  document.getElementById("menu").style.display = "none";
  document.getElementById("gameArea").style.display = "block";
  score1 = 0; score2 = 0; gameOver = false; particles = []; lastHitSide = -1;
  createPlayers();
  updateScore();
  updateControls();
}

// Cross-reference with the textbook chapter.
function startGame(mode, s) {
  setupGameScreen(mode, s);
  bot = (mode === 1 && pendingBot)
    ? { level: pendingBot, timer: 0, noise: 0, pred: { x: 720, t: 99 }, wait: BOT_LEVELS[pendingBot].serveDelay, chargeTarget: null, chargeTime: 0 }
    : null;
  if (bot) players[1].isBot = true;
  gameStarted = true;
  restartBall(Math.random() < 0.5 ? 0 : 1);
  updateControls();
  openBriefing();
}

// Group study: compare answers with classmates.

// Review the key terms before moving on to the next chapter.
function controlsHTML() {
  const S = SPORTS[sport];
  const spk = sport === "badminton" ? "Clear/Smash (hold)" : S.spikeName;
  const ab = (sl, se, sk) => `<span class="abilities">Slide: ${sl} | ${S.setName}: ${se} | ${spk}: ${sk}</span>`;
  if (gameMode === 1) {
    return `<b style="color:#248bff">PLAYER 1 (BLUE)</b><br>Move: A / D | Jump: W<br>${ab("S", "E", "Q")}<br><br>
${bot ? '<b style="color:#ff4b55">BOT (RED) · ' + bot.level.toUpperCase() + '</b>' : '<b style="color:#ff4b55">PLAYER 2 (RED)</b><br>Move: ← / → | Jump: ↑<br>' + ab("↓", "SHIFT", "ENTER")}`;
  }
  return `<b style="color:#248bff">PLAYER 1 (BLUE)</b><br>Move: A / D | Jump: W<br>${ab("S", "E", "Q")}<br><br>
<b style="color:#55b5ff">PLAYER 2 (BLUE)</b><br>Move: J / L | Jump: I<br>${ab("K", "O", "U")}<br><br>
<b style="color:#ff4b55">PLAYER 3 (RED)</b><br>Move: ← / → | Jump: ↑<br>${ab("↓", "SHIFT", "ENTER")}<br><br>
<b style="color:#ff858a">PLAYER 4 (RED)</b><br>Move: NUMPAD 1 / 3 | Jump: NUMPAD 5<br>${ab("NUMPAD 2", "NUMPAD 6", "NUMPAD 4")}`;
}

function updateControls() {
  document.getElementById("controlsDisplay").innerHTML = controlsHTML() + `<br><br>First ${gameMode === 1 ? "player" : "team"} to 10 points wins (win by 2).`;
}

const BRIEF = {
  volleyball: { name: "Volleyball", tips: [
    "Keep the ball off your side of the net. First to 10 points wins, and you must win by 2.",
    "<b>Serve:</b> the server jumps into the ball to launch it. The other side must bump it with their body first (no set or spike on the receive).",
    "<b>SET</b> sends a high lob. <b>SPIKE</b> needs a jump and slams the ball down, best from near the net with the ball above the net line.",
    "A dashed ring appears on the ball when you can hit it: <b>gold = set</b>, <b>red = spike</b>. Your arms go up for a set and swing for a spike.",
    "The net is tall and jumps are high, so time your jump." ] },
  badminton: { name: "Badminton", tips: [
    "Keep the birdie off your side. First to 10 points wins (win by 2).",
    "<b>Tap the smash button</b> for a high, deep <b>CLEAR</b>. <b>Hold</b> it and the bar fills fast, bending the angle from clear, to flat, to a steep downward smash.",
    "Hold about half for a flat <b>back-row</b> attack from deep. Hold fully near the net for a steep <b>SMASH</b>. The white mark on the bar is 50%.",
    "<b>LIFT</b> is a quick, lofted return. You can hit from a long way off, so you don't have to be perfectly under the birdie.",
    "The birdie is fast off the racquet and slows quickly in the air. A dashed ring shows when it is in reach.",
    "<b>Serve:</b> the server jumps into the birdie. The receiver can hit it right away." ] },
  tennis: { name: "Tennis", tips: [
    "First to 10 points wins (win by 2). The court is flat and fast, and the net is low.",
    "<b>Bounce rule:</b> after a hit, the ball must bounce once on the far side. The receiver hits it before or after that bounce. A second bounce loses the point.",
    "You also lose the point if your ball lands on your own side, hits the net and drops back, or bounces outside the white baselines.",
    "<b>SLICE</b> is a low floating shot that stays low after the bounce. <b>DRIVE</b> is a hard flat shot. Drive while airborne above the net for a <b>SMASH</b>.",
    "Reach is short and shots have a little natural variation, so get in position early.",
    "<b>Serve:</b> jump into the ball. A white ring shows once it has bounced, meaning you must hit it now." ] }
};

let briefingOpen = false;
function openBriefing() {
  const B = BRIEF[sport];
  const mode = bot ? "vs Bot (" + bot.level + ")" : (gameMode === 2 ? "2 vs 2" : "1 vs 1");
  document.getElementById("briefTitle").textContent = B.name + " · " + mode;
  document.getElementById("briefBody").innerHTML = "<b>CONTROLS</b><br>" + controlsHTML() + "<br><br><b>HOW IT WORKS</b><ul><li>" + B.tips.join("</li><li>") + "</li></ul>";
  document.getElementById("briefing").style.display = "flex";
  briefingOpen = true;
  for (const k in keys) keys[k] = false;
}
function hideBriefing() { document.getElementById("briefing").style.display = "none"; briefingOpen = false; }
function closeBriefing() { hideBriefing(); for (const k in keys) keys[k] = false; for (const k in pressed) delete pressed[k]; }

// Review the key terms before moving on to the next chapter.
let bot = null;
let pendingBot = null;

const BOT_LEVELS = {
  easy:   { react: 40, err: 110, move: 0.5,  setRange: 80,  setProb: 0.3, spike: 0,   slide: 0,   drive: 0.1,  power: [0.5, 0.7], ready: 770, serveDelay: 110 },
  medium: { react: 14, err: 40,  move: 0.85, setRange: 98,  setProb: 0.7, spike: 0.3, slide: 0.3, drive: 0.35, power: [0.5, 0.8], ready: 720, serveDelay: 70 },
  hard:   { react: 2,  err: 5,   move: 1,    setRange: 105, setProb: 1,   spike: 0.9, slide: 1,   drive: 0.6,  power: [0.7, 1],   ready: 670, serveDelay: 40 }
};

// Flashcards: quiz yourself, then check the answer.
function predictLanding() {
  const S = SPORTS[sport];
  let x = ball.x, y = ball.y, vx = ball.vx, vy = ball.vy;
  const r = ball.r;
  for (let i = 0; i < 400; i++) {
    vy += S.g;
    if (S.k) { const f = S.k * Math.hypot(vx, vy); vx -= vx * f; vy -= vy * f; }
    x += vx; y += vy;
    if (x < r) { x = r; vx *= -0.85; }
    if (x > WIDTH - r) { x = WIDTH - r; vx *= -0.85; }
    if (y < r) { y = r; vy *= -0.85; }
    if (Math.abs(x - netX) < r + 5 && y + r > netTop) {
      if (y < netTop && vy > 0) { y = netTop - r; vy *= -0.6; }
      else { x = x < netX ? netX - 5 - r : netX + 5 + r; vx *= -0.8; }
    }
    if (!S.k) vx *= 0.999;
    if (y + r >= ground) return { x, t: i };
  }
  return { x, t: 400 };
}

// Summary of this topic for exam revision.
function botControl() {
  if (!bot) return;
  const p = players[1], n = p.in, L = BOT_LEVELS[bot.level];
  n.left = n.right = n.jump = n.slide = n.set = n.spike = false;

  const grounded = p.y >= ground - 60;
  const serving = serveInProgress && !serveHit && servingSide === p.side;
  const waitingOnServe = serveInProgress && !serveHit && servingSide !== p.side;
  const afterOwnServe = serveInProgress && serveHit && servingSide === p.side;

  let target = L.ready, pr = null, mySide = false;

  if (serving) {
    target = ball.x;
    if (bot.wait > 0) bot.wait--;
    else if (Math.abs(p.x - ball.x) < 10 && grounded) n.jump = true;
  } else {
    bot.wait = L.serveDelay;
    if (!waitingOnServe && !afterOwnServe) {
      if (--bot.timer <= 0) { bot.timer = L.react; bot.pred = predictLanding(); bot.noise = (Math.random() * 2 - 1) * L.err; }
      pr = bot.pred;
      mySide = ball.x > netX || pr.x > netX;
      if (mySide) {
        const near = ball.x > netX && Math.abs(ball.x - p.x) < 110;
        target = Math.max(netX + 40, near ? ball.x + 12 + bot.noise * 0.3 : pr.x + 18 + bot.noise);
      }

      const receivingOk = serveHit && sport !== "volleyball" && servingSide !== p.side;
      const live = ball.x >= netX && p.slideTimer === 0 && (!serveInProgress || receivingOk);
      const d = Math.hypot(ball.x - p.x, ball.y - (p.y - 10));
      const air = p.y < ground - 62;
      const canSet = d < L.setRange * SPORTS[sport].setReach / 105 && ball.vy > -3 && Math.random() < L.setProb;

      if (bot.chargeTarget !== null) {
        bot.chargeTime++;
        const zone = air && d < SPORTS[sport].hitReach - 3 && ball.y < netTop - 10;
        if (live && zone && p.charge >= bot.chargeTarget) bot.chargeTarget = null;
        else if (bot.chargeTime > 70 || (grounded && bot.chargeTime > 12)) bot.chargeTarget = null;
      } else if (live) {
        if (sport === "tennis") {
          if (canSet) { if (Math.random() < L.drive) n.spike = true; else n.set = true; }
        } else if (sport === "badminton") {
          if (grounded && L.spike > 0 && ball.x > 470 && ball.x < 640 && ball.y > 120 && ball.y < netTop + 20 && ball.vy > -1 &&
              Math.abs(p.x - ball.x) < 50 && Math.random() < L.spike * 0.15) {
            n.jump = true; n.spike = true;
            bot.chargeTarget = L.power[0] + Math.random() * (L.power[1] - L.power[0]); bot.chargeTime = 0;
          } else if (canSet) {
            if (Math.random() < 0.5) n.set = true; else n.spike = true;
          }
        } else {
          const zone = air && d < SPORTS[sport].hitReach - 3 && ball.x < 570 && ball.y < netTop + 25;
          if (zone) { if (Math.random() < L.spike) n.spike = true; }
          else if (canSet) n.set = true;
          if (grounded && L.spike > 0 && ball.x > 480 && ball.x < 570 && ball.y > 110 && ball.y < 260 && ball.vy > -1 &&
              Math.abs(p.x - ball.x) < 45 && Math.random() < L.spike * 0.12) n.jump = true;
        }
      }
    }
  }
  n.spikeHeld = bot.chargeTarget !== null;

  const dx = target - p.x;
  if (Math.abs(dx) > 6 && Math.random() < L.move) { if (dx < 0) n.left = true; else n.right = true; }
  if (mySide && pr && pr.t < 28 && Math.abs(dx) > 100 && grounded && p.slideTimer === 0 && Math.random() < L.slide * 0.25) n.slide = true;
}

// Highlight the main idea of each section in your notes.
function restartBall(scoringSide) {

// Glossary: definitions to memorise for the test.

// Study schedule: break the reading into short sessions.
function awardPoint(winnerSide) {
  if (winnerSide === 0) score1++; else score2++;
  updateScore();
  if ((score1 >= 10 || score2 >= 10) && Math.abs(score1 - score2) >= 2) gameOver = true;

// Mnemonic to help remember this section.
function createParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) particles.push({ x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 30, color });
}
// Past-paper style question for self-assessment.
function abilityEffect(p, name) { p.effect = name; p.effectTimer = 30; createParticles(p.x, p.y, p.color); }

// Cross-reference with the textbook chapter.
function ballDistance(p) { return Math.hypot(ball.x - p.x, ball.y - (p.y - 10)); }
// Group study: compare answers with classmates.
function ballOnOwnSide(p) { return p.side === 0 ? ball.x <= netX : ball.x >= netX; }

// Review the key terms before moving on to the next chapter.
function canHit(p) {
  if (!ballOnOwnSide(p)) return false;
  if (serveInProgress) return serveHit && p.side !== servingSide && sport !== "volleyball";
  return true;
}

// Flashcards: quiz yourself, then check the answer.
function registerHit(p) {
  lastHitSide = p.side; ball.bnc = 0; ball.slice = false;
  hitShield = 10;
  if (serveInProgress && serveHit && p.side !== servingSide) serveInProgress = false;
}

// Summary of this topic for exam revision.
function tennisJitter() { return (Math.random() - 0.5) * 1.8; }

function clearNetVy(speed, base, margin, halfG, cap = 9.5) {
  const t = Math.abs(netX - ball.x) / speed || 1;
  const need = (netTop - ball.r - margin - ball.y - halfG * t * t) / t;
  return Math.min(base, Math.max(need, -cap));
}

// Practice questions - attempt before reading the solution.
function slide(p) {
  if (p.slideTimer > 0) return;
  p.slideTimer = 25;
  let dir = 0;
  if (p.in.left) dir = -1;
  if (p.in.right) dir = 1;
  if (dir === 0) dir = p.side === 0 ? 1 : -1;
  p.vx = dir * 11; p.vy = 0;
  abilityEffect(p, "SLIDE");
}

// Highlight the main idea of each section in your notes.
function setBall(p) {
  if (p.setCooldown > 0 || !canHit(p) || ballDistance(p) > SPORTS[sport].setReach) return;
  p.setCooldown = sport === "tennis" ? 50 : 35;
  const dir = p.side === 0 ? 1 : -1, S = SPORTS[sport];
  registerHit(p);
  if (sport === "tennis") {
    const vx = 10.5;
    ball.vy = clearNetVy(vx, -1, 4, 0.077) + tennisJitter();
    ball.vx = dir * vx + p.vx * 0.15;
    ball.slice = true;
  } else {
    ball.vx = dir * S.setV[0] + p.vx * 0.2;
    ball.vy = sport === "volleyball" ? -Math.min(-S.setV[1], Math.sqrt(0.5 * Math.max(ball.y - 30, 25))) : S.setV[1];
  }
  ball.x += dir * 8;
  abilityEffect(p, S.setName);
}

// Revision tip: repeat difficult topics at spaced intervals.
function spikeBall(p, power = 1) {
  if (p.spikeCooldown > 0 || !canHit(p) || ballDistance(p) > SPORTS[sport].hitReach) return;
  const air = p.y < ground - 62, dir = p.side === 0 ? 1 : -1;
  let vx, vy, label;
  if (sport === "volleyball") {
    if (!air) return;
    vx = dir * 9; vy = clearNetVy(9, 11, 8, 0.125); label = "SPIKE";
  } else if (sport === "badminton") {

    const deg = SMASH.a0 + (SMASH.a1 - SMASH.a0) * power;
    const a = deg * Math.PI / 180;
    const sp = SMASH.s0 + (SMASH.s1 - SMASH.s0) * power;
    vx = dir * Math.cos(a) * sp; vy = -Math.sin(a) * sp;
    if (power < 0.7) vy = clearNetVy(Math.abs(vx), vy, 16, 0.115, 14);   // flat and mid holds clear the net; full smashes do not
    label = power < 0.5 ? "CLEAR" : "SMASH " + Math.round(power * 100) + "%";
  } else {
    if (air && ball.y < netTop - 30) { registerHit(p); vx = dir * 12; vy = clearNetVy(12, 9, 4, 0.14) + tennisJitter(); label = "SMASH"; }
    else { registerHit(p); vx = dir * 16; vy = clearNetVy(16, -1, 4, 0.14) + tennisJitter(); label = "DRIVE"; }
  }
  if (sport !== "tennis") registerHit(p);
  p.spikeCooldown = sport === "tennis" ? 60 : (sport === "badminton" ? 30 : 50);
  ball.vx = vx + p.vx * 0.2; ball.vy = vy;
  ball.x += dir * 12;
  abilityEffect(p, label);
  createParticles(ball.x, ball.y, "#ffd166", 18);
}

// Glossary: definitions to memorise for the test.
function movePlayers() {
  const S = SPORTS[sport];
  players.forEach(p => {
    const n = p.in;
    p.setCooldown = Math.max(0, p.setCooldown - 1);
    p.spikeCooldown = Math.max(0, p.spikeCooldown - 1);
    p.effectTimer = Math.max(0, p.effectTimer - 1);
    if (p.effectTimer === 0) p.effect = "";

    if (n.slide) slide(p);
    if (n.set) setBall(p);

    if (sport === "badminton") {

      if (n.spike && p.spikeCooldown === 0) { p.charging = true; p.charge = 0; }
      if (p.charging) {
        if (n.spikeHeld) p.charge = Math.min(1, p.charge + 1 / 16);
        else { p.charging = false; spikeBall(p, p.charge); p.charge = 0; }
      }
    } else if (n.spike) spikeBall(p, 1);

    if (p.slideTimer > 0) p.slideTimer--;
    else { if (n.left) p.x -= 5; if (n.right) p.x += 5; }

    if (n.jump && p.y >= ground - 60) { p.vy = -S.jump; p.slideTimer = 0; }

    p.vy += 0.55;
    p.y += p.vy;
    if (p.y > ground - 60) { p.y = ground - 60; p.vy = 0; }

    p.x = Math.max(25, Math.min(875, p.x));
    if (p.side === 0) p.x = Math.min(p.x, netX - 30); else p.x = Math.max(p.x, netX + 30);

    if (p.slideTimer > 0) { p.x += p.vx; p.vx *= 0.88; } else p.vx = 0;
  });
}

// Study schedule: break the reading into short sessions.
function collideBall() {
  for (let i = 0; i < players.length; i++) {
    const p = players[i];
    const dx = ball.x - p.x, dy = ball.y - (p.y - 10);
    const dist = Math.hypot(dx, dy);
    const minDist = ball.r + (p.slideTimer > 0 ? 32 : p.radius);

    const touching = dist < minDist && dist > 0;
    if (hitShield > 0 && p.side === lastHitSide) { playerTouchingBall[i] = touching; continue; }
    if (!touching) { playerTouchingBall[i] = false; continue; }
    if (playerTouchingBall[i]) continue;
    playerTouchingBall[i] = true;

    const dir = p.side === 0 ? 1 : -1, S = SPORTS[sport];

    if (serveInProgress) {
      if (!serveHit && p.side !== servingSide) { awardPoint(servingSide); return; }

      if (!serveHit && p.side === servingSide) {
        serveHit = true; servePlayerIndex = i;
        lastHitSide = p.side; ball.bnc = 0; hitShield = 10;
        if (sport === "tennis") { ball.vx = dir * S.serve[0]; ball.vy = clearNetVy(S.serve[0], 2, 6, 0.14); }
        else { ball.vx = dir * S.serve[0]; ball.vy = S.serve[1]; }
        const nx = dx / dist, ny = dy / dist;
        ball.x = p.x + nx * minDist; ball.y = p.y - 10 + ny * minDist;
        createParticles(ball.x, ball.y, p.color, 5);
        return;
      }
      if (serveHit && p.side === servingSide) { awardPoint(p.side === 0 ? 1 : 0); return; }
      if (p.side !== servingSide) serveInProgress = false;
    }

    const nx = dx / dist, ny = dy / dist;
    ball.x = p.x + nx * minDist; ball.y = p.y - 10 + ny * minDist;
    registerHit(p);

    if (sport === "tennis") {

      ball.vx = dir * 8 + p.vx * 0.3;
      ball.vy = clearNetVy(8, -3, 6, 0.14) + tennisJitter();
    } else {
      const speed = Math.hypot(ball.vx, ball.vy);
      const floor = sport === "badminton" ? 12 : 6;
      ball.vx = nx * Math.max(speed, floor) + p.vx * 0.3;
      ball.vy = ny * Math.max(speed, floor) - 1;
    }
    createParticles(ball.x, ball.y, p.color, 5);
  }
}

// Mnemonic to help remember this section.
function groundContact() {
  const side = ball.x < netX ? 0 : 1;
  if (sport !== "tennis" || lastHitSide < 0) { awardPoint(1 - side); return; }
  if (ball.bnc === 0) {
    const out = ball.x < 60 || ball.x > WIDTH - 60;
    if (side === lastHitSide || out) { awardPoint(1 - lastHitSide); return; }
    ball.bnc = 1;
    const sl = ball.slice;
    ball.y = ground - ball.r;
    ball.vy = -Math.max(Math.abs(ball.vy) * (sl ? 0.4 : 0.7), sl ? 2.5 : 4.5);
    ball.vx *= sl ? 1.05 : 0.97;
    createParticles(ball.x, ground, "#ffffff", 7);
  } else {
    awardPoint(lastHitSide);
  }
}

// Past-paper style question for self-assessment.
function updateBall() {
  if (ball.vx === 0 && ball.vy === 0) { collideBall(); return; }
  if (hitShield > 0) hitShield--;
  const S = SPORTS[sport];

  ball.vy += S.g * (ball.slice ? 0.55 : 1);
  if (S.k) { const f = S.k * Math.hypot(ball.vx, ball.vy); ball.vx -= ball.vx * f; ball.vy -= ball.vy * f; }
  ball.x += ball.vx; ball.y += ball.vy;

  if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -0.85; }
  if (ball.x > WIDTH - ball.r) { ball.x = WIDTH - ball.r; ball.vx *= -0.85; }
  if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -0.85; }

  if (Math.abs(ball.x - netX) < ball.r + 5 && ball.y + ball.r > netTop) {
    if (ball.y < netTop && ball.vy > 0) { ball.y = netTop - ball.r; ball.vy *= -0.6; }
    else { ball.x = ball.x < netX ? netX - 5 - ball.r : netX + 5 + ball.r; ball.vx *= -0.8; }
  }

  collideBall();
  if (ball.y + ball.r >= ground) groundContact();
  if (!S.k) ball.vx *= 0.999;
}

// Cross-reference with the textbook chapter.
function updateParticles() {
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
}

// Group study: compare answers with classmates.
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 30);

  });

}

  ctx.fillStyle = "#ffffff"; ctx.fillRect(netX - 17, netTop, 34, 5);

}

// Flashcards: quiz yourself, then check the answer.
function drawArms(p) {
  const d = p.side === 0 ? 1 : -1, kind = (p.effect || "").split(" ")[0], t = p.effectTimer / 30;
  const sx = p.x, sy = p.y - 14;
  let hands;
  if (p.effectTimer > 0 && kind === "SET") hands = [[sx - 14, sy - 40], [sx + 14, sy - 40]];
  else if (p.effectTimer > 0 && kind === "SPIKE") {
    const a = -2.3 + (1 - t) * 2.7;
    hands = [[sx + d * Math.cos(a) * 42, sy + Math.sin(a) * 42], [sx - d * 12, sy + 16]];
  } else hands = [[sx - 17, sy + 18], [sx + 17, sy + 18]];
  ctx.strokeStyle = p.color; ctx.lineWidth = 7; ctx.lineCap = "round";
  hands.forEach((h, i) => {
    ctx.beginPath(); ctx.moveTo(sx + (i === 0 ? -9 : 9), sy + 2); ctx.lineTo(h[0], h[1]); ctx.stroke();
  });
  ctx.fillStyle = "#fff";
  hands.forEach(h => { ctx.beginPath(); ctx.arc(h[0], h[1], 4, 0, Math.PI * 2); ctx.fill(); });
}

// Summary of this topic for exam revision.
function drawPlayer(p) {
  if (p.slideTimer > 0) {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 35, 15, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y - 10, p.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(p.x + (p.side === 0 ? 8 : -8), p.y - 16, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = p.color; ctx.lineWidth = 8; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.x - 8, p.y + 12); ctx.lineTo(p.x - 12, p.y + 28);
    ctx.moveTo(p.x + 8, p.y + 12); ctx.lineTo(p.x + 12, p.y + 28);
    ctx.stroke();
    if (sport === "volleyball") drawArms(p);
  }

  if (sport !== "volleyball") drawRacquet(p);

  if (gameMode === 2) {
    ctx.fillStyle = "white"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center";
    ctx.fillText(players.indexOf(p) + 1, p.x, p.y - 35);
  }

  if (p.charging) {
    const w = 44, bx = p.x - w / 2, by = p.y - 92;
    ctx.fillStyle = "#1d1d1b"; ctx.fillRect(bx - 2, by - 2, w + 4, 10);
    ctx.fillStyle = p.charge < 0.5 ? "#f2b134" : (p.charge < 0.95 ? "#e8782a" : "#d9381e");
    ctx.fillRect(bx, by, w * p.charge, 6);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(bx + w * 0.5 - 1, by - 3, 2, 12);
    ctx.fillStyle = "#1d1d1b"; ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
    ctx.fillText((p.charge < 0.5 ? "CLEAR " : "SMASH ") + Math.round(p.charge * 100) + "%", p.x, by - 6);
  }

  if (p.effectTimer > 0) {
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
    ctx.fillText(p.effect, p.x, p.y - 55);
  }
}

// Practice questions - attempt before reading the solution.
function drawRacquet(p) {
  const d = p.side === 0 ? 1 : -1, kind = (p.effect || "").split(" ")[0];
  let a = -1.0;
  if (p.slideTimer > 0) a = 0.1;
  else if (p.effectTimer > 0) a = ["SPIKE","SMASH","DRIVE"].includes(kind) ? 0.6 : (kind === "SLICE" ? 0.15 : -1.5);
  const theta = d === 1 ? a : Math.PI - a;
  const sx = p.x + d * 14, sy = p.y - 2, handle = 16;
  const hx = sx + Math.cos(theta) * handle, hy = sy + Math.sin(theta) * handle;
  const big = sport === "tennis", rx = big ? 18 : 15, ry = big ? 13 : 10;
  const cx = hx + Math.cos(theta) * rx, cy = hy + Math.sin(theta) * rx;

  ctx.lineCap = "round"; ctx.strokeStyle = "#222"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(theta);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(40,40,40,0.55)"; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = -rx + 5; x < rx - 3; x += 5) { ctx.moveTo(x, -ry + 2); ctx.lineTo(x, ry - 2); }
  for (let y = -ry + 4; y < ry - 2; y += 5) { ctx.moveTo(-rx + 3, y); ctx.lineTo(rx - 3, y); }
  ctx.stroke();
  ctx.strokeStyle = big ? "#222" : "#555"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

// Highlight the main idea of each section in your notes.
function drawTennisBall() {
  if (ball.slice) {
    ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 2;
    const sgn = ball.vx >= 0 ? -1 : 1;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(ball.x + sgn * 18, ball.y + i * 6); ctx.lineTo(ball.x + sgn * 34, ball.y + i * 6); ctx.stroke(); }
  }
  ctx.fillStyle = "#c8f03c";
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "white"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ball.x - ball.r * 1.15, ball.y, ball.r * 0.95, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(ball.x + ball.r * 1.15, ball.y, ball.r * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  ctx.strokeStyle = "#6b8e0a";
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.stroke();
}

// Revision tip: repeat difficult topics at spaced intervals.
function drawBirdie() {
  const moving = Math.hypot(ball.vx, ball.vy) > 0.5;
  const ang = moving ? Math.atan2(ball.vy, ball.vx) : Math.PI / 2;
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ang);
  ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(-17, -13); ctx.lineTo(-17, 13); ctx.lineTo(4, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  for (let y = -9; y <= 9; y += 4.5) { ctx.moveTo(3, y * 0.5); ctx.lineTo(-17, y * 1.4); }
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, -10.5); ctx.lineTo(-10, 10.5); ctx.stroke();
  ctx.fillStyle = "#e8c27a"; ctx.strokeStyle = "#7a5a20";
  ctx.beginPath(); ctx.arc(8, 0, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// Glossary: definitions to memorise for the test.
function drawBall() {
  if (sport === "tennis") { drawTennisBall(); return; }
  if (sport === "badminton") { drawBirdie(); return; }
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r - 5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ball.x - ball.r, ball.y); ctx.lineTo(ball.x + ball.r, ball.y);
  ctx.moveTo(ball.x, ball.y - ball.r); ctx.lineTo(ball.x, ball.y + ball.r);
  ctx.stroke();
}

// Study schedule: break the reading into short sessions.
function drawCues() {
  if (!gameStarted || gameOver) return;
  const S = SPORTS[sport];
  let canSet = false, canSpike = false;
  for (const p of players) {
    if (!canHit(p)) continue;
    const d = ballDistance(p);
    if (d < S.setReach) canSet = true;
    if (d < S.hitReach && (sport !== "volleyball" || p.y < ground - 62)) canSpike = true;
  }
  if (canSet || canSpike) {
    const col = canSpike ? "#e8382a" : "#f2b134";
    const rad = 26 + Math.sin(performance.now() / 110) * 2.5;
    ctx.save();
    ctx.setLineDash([6, 5]); ctx.strokeStyle = col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = col; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
    ctx.fillText(canSpike ? S.spikeName : S.setName, ball.x, ball.y - rad - 6);
    ctx.restore();
  }
  if (sport === "tennis" && ball.bnc > 0) {
    ctx.save(); ctx.setLineDash([3, 4]); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 23, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  for (const p of players) {
    if (p.effectTimer < 22) continue;
    const kind = (p.effect || "").split(" ")[0];
    const strong = ["SPIKE","SMASH","DRIVE"].includes(kind);
    if (!strong && !["SET","DROP","SLICE","CLEAR"].includes(kind)) continue;
    const k = (p.effectTimer - 21) / 9;
    ctx.save();
    ctx.globalAlpha = k; ctx.strokeStyle = strong ? "#e8382a" : "#f2b134"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 16 + (1 - k) * 34, 0, Math.PI * 2); ctx.stroke();
    if (strong) {
      const sp = Math.hypot(ball.vx, ball.vy) || 1, ux = ball.vx / sp, uy = ball.vy / sp;
      ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(ball.x - ux * 22 - uy * i * 7, ball.y - uy * 22 + ux * i * 7);
        ctx.lineTo(ball.x - ux * 52 - uy * i * 7, ball.y - uy * 52 + ux * i * 7);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

// Mnemonic to help remember this section.
function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 48px Arial"; ctx.textAlign = "center";
  ctx.fillText(score1 > score2 ? "BLUE WINS!" : "RED WINS!", WIDTH / 2, 220);
  ctx.fillStyle = "white"; ctx.font = "25px Arial";
  ctx.fillText("Click RESTART GAME to play again", WIDTH / 2, 275);
}

// Past-paper style question for self-assessment.
function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);
  drawCourt();
  players.forEach(drawPlayer);
  drawBall();
  drawCues();
  drawParticles();
  if (gameOver) drawGameOver();
}

const STEP = 1000 / 60;
let lastTime = 0, acc = 0;

// Cross-reference with the textbook chapter.
function loop(t = 0) {
  acc += Math.min(t - lastTime, 100);
  lastTime = t;
  while (acc >= STEP) {
    if (gameStarted && !briefingOpen && !gameOver) {
      gatherInputs(); botControl(); movePlayers(); updateBall(); updateParticles();
    }
    for (const key in pressed) delete pressed[key];
    acc -= STEP;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
